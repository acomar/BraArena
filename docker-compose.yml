services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - interview_data:/var/lib/postgresql/data
    networks: [internal]
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://interview:${POSTGRES_PASSWORD}@db:5432/interview
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
    depends_on: [db]
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]
volumes:
  interview_data:
networks:
  internal:
