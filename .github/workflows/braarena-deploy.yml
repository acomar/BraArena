name: BraArena POC
on:
  workflow_dispatch:
  push:
    branches: [feat/ai-interview-poc]
permissions:
  contents: read
concurrency:
  group: braarena-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend and PostgreSQL
        run: |
          RELEASE_SHA="$GITHUB_SHA" POSTGRES_PASSWORD=test ADMIN_TOKEN=compose-validation BRAARENA_IP=127.0.0.1 TLS_CERT=/unused/fullchain TLS_KEY=/unused/key docker compose -f deploy/compose.production.yml config --quiet
          docker build -t braarena-api:development api
          docker compose -f compose.test.yml up --abort-on-container-exit --exit-code-from test
      - name: Angular and Playwright
        run: |
          docker build -t braarena-web:development web
          docker build -t braarena-browser:test tests
          docker compose -f tests/compose.browser.yml up --abort-on-container-exit --exit-code-from browser
      - name: Save verified images
        run: docker save braarena-api:development braarena-web:development | gzip -1 > /tmp/braarena-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-images
          path: /tmp/braarena-images.tar.gz
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/feat/ai-interview-poc'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: verified-images}
      - name: Publish the tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load -i braarena-images.tar.gz
          # The VPS can retrieve the identical images without long-lived SSH or registry credentials.
          gh release view "poc-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "poc-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "POC ${GITHUB_SHA:0:8}" --notes "Imagens verificadas pelo CI."
          gh release upload "poc-$GITHUB_SHA" braarena-images.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
  registry:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: verified-images}
      - name: Push single-platform images linked to BraArena
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load -i braarena-images.tar.gz
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in api web; do
            tag="ghcr.io/acomar/braarena-poc-$component:$GITHUB_SHA"
            docker tag "braarena-$component:development" "$tag"
            docker push --platform linux/amd64 "$tag"
          done
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify the deployed SHA over public HTTPS
        env:
          PUBLIC_URL: ${{ vars.BRAARENA_PUBLIC_URL || 'https://191.252.92.181:8443' }}
        run: |
          set -eu
          for attempt in $(seq 1 75); do
            if curl -fsS --max-time 8 "$PUBLIC_URL/health" | jq -e --arg sha "$GITHUB_SHA" '.ok and .release==$sha'; then
              curl -fsS "$PUBLIC_URL/" | grep -q 'app-root'
              test "$(curl -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/templates")" = 401
              exit 0
            fi
            sleep 12
          done
          exit 1
