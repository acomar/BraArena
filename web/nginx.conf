limit_req_zone $binary_remote_addr zone=braarena_api:1m rate=12r/s;
limit_req_zone $binary_remote_addr zone=braarena_login:1m rate=12r/m;
map $status $log_request { default 0; ~^5 1; }
log_format braarena_errors '$request_method $uri $status';
server {
  listen 80;
  include /etc/nginx/braarena-listeners/*.conf;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/access.log braarena_errors if=$log_request;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(self)" always;
  add_header Cache-Control "no-store" always;
  limit_req_status 429;
  client_max_body_size 1m;
  location ~ ^/api/candidate/[^/]+/session$ {
    limit_req zone=braarena_login burst=6 nodelay;
    proxy_pass http://api:3000;
  }
  location ~ ^/api/candidate/[^/]+/recording$ {
    client_max_body_size 64m;
    limit_req zone=braarena_api burst=20 nodelay;
    proxy_pass http://api:3000;
  }
  location /api/ {
    limit_req zone=braarena_api burst=24 nodelay;
    proxy_pass http://api:3000;
  }
  location = /health { proxy_pass http://api:3000; }
  location / { try_files $uri $uri/ /index.html; }
}
