<script>const CATALOG=[
{ id:'a01',title:'Signals: carteira em tempo real',category:'Angular',level:'Pleno',minutes:25,icon:'◈',source:'angular-challenges',summary:'Implemente um painel de saldo agregado, com sinais computados e sem cálculos no template.',context:'Uma squad de liquidez precisa mostrar posições atualizadas sem recarregar a página. Você recebe transações e precisa calcular saldos de forma reativa.',tasks:['Criar a modelagem tipada de Account e Position.','Separar signals de entrada de valores derivados por computed().','Aplicar filtros por moeda e exibir totais formatados.','Explicar como evitar mutações silenciosas e recomputações desnecessárias.'],criteria:['Valores derivados não duplicam estado mutável.','Atualizações são imutáveis e reativas.','Estados vazio e erro estão previstos.','A solução é testável e acessível.'],starter:`import { Component, signal, computed } from '@angular/core';

type Position = { id: string; currency: string; amount: number };

@Component({
  selector: 'app-liquidity', standalone: true,
  template: '\x3ch2\x3ePosições\x3c/h2\x3e'
})
export class LiquidityComponent {
  positions = signal<Position[]>([]);
  currency = signal('BRL');
  // TODO: filteredPositions e totalAmount como computed
}`,guide:['Apresente o cenário e confirme entendimento.','Peça o desenho do estado e das dependências.','Observe a implementação e introduza nova moeda.','Explore desempenho, testes e trade-offs.'],questions:['Por que usar computed em vez de um método no template?','Como reagir a um WebSocket de atualizações?','Quais casos de teste poderiam falhar em produção?'],signals:['Identifica derived state e imutabilidade sem pistas.','Sabe diferenciar signals e RxJS por origem dos eventos.','Propõe testes de unidade e estados de falha.'],redflags:['Mutação direta do array dentro do signal.','Assinaturas manuais sem cleanup para tudo.','Ignora precisão e formato de moedas.'],hints:['Comece listando quais dados são fonte e quais são derivados.','Uma computed pode depender de positions() e currency().'],rubricFocus:'Arquitetura e domínio reativo',tags:['signals','computed','finanças']},
{ id:'a02',title:'Autocomplete com RxJS',category:'Angular',level:'Pleno',minutes:30,icon:'⌁',source:'angular-challenges',summary:'Construa uma busca assíncrona sem requests obsoletas, usando debounce e cancelamento.',context:'Uma tela de seleção de clientes consulta sugestões após o usuário digitar. A API pode responder fora de ordem.',tasks:['Configurar FormControl com valueChanges.','Aplicar debounceTime, distinctUntilChanged e switchMap.','Exibir loading, erros e resultados vazios.','Descrever teste para condição de corrida.'],criteria:['Busca anterior não sobrescreve resultado mais recente.','Tratamento de erro não finaliza a stream principal.','Desinscrição/ciclo de vida estão adequados.','Interface suporta teclado e acessibilidade.'],starter:`search = new FormControl('', { nonNullable: true });
// TODO: results$ = search.valueChanges.pipe(...)
// API: customers.search(query): Observable<Customer[]>`,guide:['Explique a latência variável da API.','Peça a sequência de operadores.','Simule digitação rápida e erro da API.','Discuta teardown, UX e testes de marble.'],questions:['Por que switchMap e não mergeMap?','Onde você colocaria catchError?','Quando Signals são úteis aqui?'],signals:['Entende cancelamento e concorrência.','Localiza corretamente catchError.','Relaciona feedback visual e estados assíncronos.'],redflags:['subscribe dentro de subscribe.','Não lida com respostas fora de ordem.','Engole erros silenciosamente.'],hints:['Considere o comportamento de switchMap ao receber um valor novo.','Trate falhas da requisição dentro do stream interno.'],rubricFocus:'RxJS e assincronismo',tags:['rxjs','forms','async']},
{ id:'a03',title:'Tabela de 50 mil operações',category:'Performance',level:'Sênior',minutes:45,icon:'▤',source:'lendwell',summary:'Projete uma listagem financeira fluida com filtros combinados e rolagem virtual.',context:'Uma mesa operacional acompanha 50 mil transferências. O usuário filtra por favorecido e status, sem travamentos.',tasks:['Explicar a estratégia de dados e renderização virtual.','Combinar busca e filtros com estado derivado.','Adicionar feedback de carregamento, vazio e erro.','Propor indicadores e teste de performance.'],criteria:['Não renderiza dezenas de milhares de nós DOM.','Filtros aplicados de forma combinada e consistente.','Atualização preserva responsividade.','Apresenta estratégia de medição real.'],starter:`type Transfer = { id: string; beneficiary: string; status: 'pending'|'settled'|'failed'; amount: number };
// Dados: Transfer[] com 50 mil itens.
// TODO: arquitetura de virtual scroll, filtros e estados de UX.`,guide:['Apresente tamanho do dataset.','Solicite arquitetura antes do código.','Peça filtros e cenário de digitação.','Pergunte sobre profile, métricas e volumes maiores.'],questions:['Qual custo de filtrar 50 mil itens a cada tecla?','Quando paginação server-side é melhor que virtual scroll?','Como medir tempo até interação?'],signals:['Utiliza Angular CDK virtual scroll ou técnica equivalente.','Conhece OnPush, trackBy e efeitos de change detection.','Conecta solução a limites de dados e UX.'],redflags:['*ngFor direto em todos os registros.','Afirma que otimização não exige medição.','Não cobre loading/empty/error.'],hints:['Pergunte quantos elementos precisam estar no DOM ao mesmo tempo.','Debounce evita filtros excessivos durante digitação.'],rubricFocus:'Performance real e trade-offs',tags:['performance','virtual-scroll','signals']},
{ id:'a04',title:'Monitoramento de serviços em tempo real',category:'Arquitetura',level:'Sênior',minutes:50,icon:'◉',source:'cloudnc',summary:'Desenhe um painel que concilie metadados REST e eventos contínuos por WebSocket.',context:'Serviços de autorização em uma financeira publicam transições de estado em tempo real. Os metadados são consultados separadamente.',tasks:['Definir store de serviços e eventos por ID.','Consumir stream e resolver enriquecimento por REST.','Mostrar o último status e histórico por serviço.','Tratar reconexão, ordenação, duplicidade e ressincronização.'],criteria:['Não perde eventos em condições normais.','Modela eventos em ordem verificável.','Lida com conexões intermitentes.','Isola responsabilidades e torna o fluxo testável.'],starter:`type StatusEvent = { serviceId: string; status: 'ON'|'OFF'; at: string; eventId: string };
// REST /services/:id
// WebSocket: StatusEvent[]
// TODO: store e fluxo de enriquecimento`,guide:['Defina origens de dados e responsabilidades.','Peça diagrama de estado e ciclo de vida.','Introduza desconexão e mensagens duplicadas.','Discuta memória, testes e observabilidade.'],questions:['Como deduplicar eventos ao reconectar?','Qual chave permite ordering por serviço?','Como evitar várias chamadas REST para o mesmo serviço?'],signals:['Separa event log de projeções derivadas.','Discute idempotência, ordenação e reconexão.','Demonstra arquitetura testável e observável.'],redflags:['Apenas altera cor do último evento e descarta histórico.','Não considera desconexão.','Dispara requests REST redundantes sem cache.'],hints:['Desenhe uma estrutura por serviceId.','Um evento pode chegar antes dos metadados.'],rubricFocus:'Arquitetura de eventos e consistência',tags:['websocket','rxjs','system design']},
{ id:'a05',title:'Formulário de transferência segura',category:'Angular',level:'Pleno',minutes:35,icon:'□',source:'original',summary:'Valide um formulário financeiro com regras cruzadas, async validation e feedback acessível.',context:'Cliente agenda uma transferência. Valor, limites e favorecido possuem validações síncronas e assíncronas.',tasks:['Modelar FormGroup tipado.','Validar limite por período e valor disponível.','Adicionar async validator do favorecido.','Exibir erros com mensagem útil e acessível.'],criteria:['Formulário é tipado, sem any.','Regras cruzadas não se repetem no template.','Submissão respeita estado PENDING e INVALID.','Testes cobrem limites e falha de rede.'],starter:`type TransferForm = {
  amount: FormControl<number>;
  beneficiary: FormControl<string>;
  scheduledFor: FormControl<string>;
};
// TODO: group, validators e submissão segura`,guide:['Pergunte sobre campos e regras.','Explore validade e async validators.','Mude limite para testar desenho.','Discuta acessibilidade e testes.'],questions:['Como impedir double submit?','Como sinalizar PENDING para usuário?','Quando usar validator de grupo?'],signals:['Usa typed forms e validadores compostos.','Prevê race conditions de async validator.','Considera segurança e clareza de UX.'],redflags:['Valida só no botão de salvar.','Permite duplo envio.','Não informa motivo do erro.'],hints:['Regras que dependem de dois campos podem ficar no grupo.','O estado PENDING precisa ser tratado.'],rubricFocus:'Qualidade e robustez de formulários',tags:['forms','validators','acessibilidade']},
{ id:'a06',title:'Componentização de um design system',category:'Angular',level:'Sênior',minutes:40,icon:'▦',source:'angular-challenges',summary:'Crie uma API de componente reutilizável com acessibilidade, composição e testes.',context:'Diversos produtos internos precisam do mesmo componente de seleção com busca e estados de carregamento.',tasks:['Propor API pública do componente.','Escolher entre content projection e inputs.','Descrever teclado, foco, ARIA e estados.','Propor testes, documentação e versionamento.'],criteria:['API clara e previsível.','Sem acoplamento a regra de negócio.','Acessibilidade tratada como requisito funcional.','Estratégia de testes baseada em comportamento.'],starter:`@Component({selector:'ba-select', standalone:true, template: ''})
export class SelectComponent<T> {
  // TODO: inputs/outputs, composição, CVA ou alternativa
}`,guide:['Peça mapa de consumo do componente.','Explore API e responsabilidades.','Introduza múltiplos projetos e teclado.','Discuta versionamento e manutenção.'],questions:['Quando ControlValueAccessor é apropriado?','Como evitar breaking changes?','Que contratos de acessibilidade são essenciais?'],signals:['Modela componente como API reutilizável.','Aborda a11y, documentação e testes.','Sabe analisar trade-offs de abstração.'],redflags:['API centrada em um único formulário.','Ignora navegação por teclado.','Abstração exagerada sem necessidade.'],hints:['Pense em quem consome a API, não em como você a implementaria uma vez.'],rubricFocus:'Design de API e acessibilidade',tags:['componentes','design-system','a11y']},
{ id:'a07',title:'Cache e estado de concorrência',category:'Arquitetura',level:'Tech Lead',minutes:45,icon:'⇄',source:'original',summary:'Evolua o desenho de estado de uma tela com cache, invalidação e múltiplas consultas simultâneas.',context:'Um painel de investimentos mostra posição de carteira por conta. Consultas podem retornar em ordens diferentes, e há atualizações externas.',tasks:['Separar cache de servidor e estado local de UI.','Especificar política de invalidação e TTL.','Tratar resultados obsoletos, repetição e retry.','Definir critérios de observabilidade e testes.'],criteria:['Consistência eventual e fonte de verdade explicitadas.','Plano de invalidação compatível com domínio financeiro.','Concorrência e erro têm comportamentos definidos.','Consegue comunicar trade-offs.'],starter:`type PortfolioQuery = { accountId:string; asOf:string };
// Defina o contrato do store/cache e o fluxo de invalidação.`,guide:['Comece com arquitetura em alto nível.','Desenhe fluxo de consulta e cache.','Introduza atualização de outra aba.','Pergunte sobre consistência e métricas.'],questions:['Que dados não podem ficar stale?','Onde deve ocorrer a invalidação?','Como evitar cache poisoning entre contas?'],signals:['Consciência do contexto financeiro e segurança.','Argumenta decisões, não só cita bibliotecas.','Planeja telemetria para detectar divergência.'],redflags:['Trata cache como fonte definitiva.','Não segrega dados por conta.','Não há estratégia para inconsistência.'],hints:['Defina primeiro o que significa dado válido para o produto.'],rubricFocus:'Decisão arquitetural e risco',tags:['cache','estado','financeiro']},
{ id:'a08',title:'Code review: memória e OnPush',category:'Angular',level:'Sênior',minutes:25,icon:'⌘',source:'angular-challenges',summary:'Investigue um snippet Angular com possíveis vazamentos e renderizações redundantes.',context:'Após navegar entre telas, a aplicação fica lenta e múltiplas notificações são exibidas.',tasks:['Identificar o potencial vazamento de subscribe.','Explicar mutação de objetos com OnPush.','Propor correções e testes de regressão.','Priorizar problemas por impacto.'],criteria:['Reconhece ciclo de vida e limpeza.','Sabe explicar atualização de referências.','Fornece proposta testável.','Evita recomendar refatoração sem valor.'],starter:`@Component({ changeDetection: ChangeDetectionStrategy.OnPush })

}`,guide:['Mostre código sem indicar os problemas.','Peça hipóteses e como validar.','Explore correções pequenas e alternativas.','Solicite estratégia de teste.'],questions:['O que muda com async pipe ou takeUntilDestroyed?','Por que push pode ser problemático com OnPush?','Como identificar vazamento sem suposição?'],signals:['Identifica problemas verificáveis e seus efeitos.','Diferencia leak de bug de detecção de mudança.','Mostra pragmatismo na correção.'],redflags:['Confunde OnPush com desligar change detection.','Propõe setInterval para forçar refresh.','Não menciona teardown.'],hints:['O que acontece se entrar e sair da tela repetidamente?'],rubricFocus:'Diagnóstico e depuração',tags:['onpush','memory','code review']},
{ id:'a09',title:'Liderança: incidente de pagamentos',category:'Tech Lead',level:'Tech Lead',minutes:30,icon:'♜',source:'original',summary:'Conduza um exercício situacional de priorização, comunicação e decisões técnicas sob pressão.',context:'Uma implantação causou erros intermitentes em transferências. Produto pressiona por correção imediata, o time tem versões divergentes da causa.',tasks:['Estruturar triagem, contenção e comunicação.','Definir rollback, mitigação e sinais objetivos.','Propor condução de postmortem sem culpabilização.','Planejar medidas preventivas e ownership.'],criteria:['Prioriza segurança e impacto ao cliente.','Não assume causa sem evidência.','Distribui responsabilidades e comunica decisões.','Propõe aprendizado após restauração.'],starter:`Situação: 14h12. Falhas 5xx aumentaram após deploy.

<div class="grid grid-4 metrics"><div class="card metric"><span class="metric-icon">◉</span><div class="metric-num">${sessions.length}</div><div class="metric-label">Entrevistas realizadas</div></div><div class="card metric metric-green"><span class="metric-icon">♙</span><div class="metric-num">${app.candidates.length}</div><div class="metric-label">Candidatos cadastrados</div></div><div class="card metric metric-orange"><span class="metric-icon">▦</span><div class="metric-num">${CATALOG.length+app.customChallenges.length}</div><div class="metric-label">Desafios disponíveis</div></div><div class="card metric metric-blue"><span class="metric-icon">↗</span><div class="metric-num">${avg===null?'—':avg}</div><div class="metric-label">Média de avaliações /100</div></div></div>
<div class="grid dashboard-main"><div class="stack"><div class="hero-card"><div class="hero-copy"><span class="hero-eyebrow">PARA ENTREVISTADORES EXIGENTES</span><h2>Descubra como a pessoa pensa, não apenas o que ela sabe.</h2><p>Conduza desafios reais com roteiro, timer, critérios objetivos e registro de evidências. Tudo em um único lugar.</p>${button('newInterview','Iniciar nova avaliação ↗','btn')}</div><div class="hero-illustration" aria-hidden="true"><div class="hero-art"><b>&lt;/&gt;</b><i></i><i></i><i></i></div></div></div>
<div class="card"><div class="card-hd"><div><h2>Entrevistas recentes</h2><div class="card-note">Seu histórico de avaliação</div></div>${button('goReports','Ver todas ↗','btn btn-sm btn-quiet')}</div>${sessions.length? [...sessions].sort((a,b)=>b.startedAt.localeCompare(a.startedAt)).slice(0,5).map(s=>{let c=getCandidate(s.candidateId),ch=getChallenge(s.challengeId);return `<div class="recent-item"><div class="recent-icon">${esc((c?.name||'?')[0].toUpperCase())}</div><div class="recent-info"><b>${esc(c?.name||'Candidato removido')}</b><small>${esc(ch?.title||'Desafio removido')} · ${dt(s.startedAt)}</small></div><span>${statusBadge(s)}</span>${button('openSession','Abrir','btn btn-sm',`data-id="${esc(s.id)}"`)}</div>`}).join(''):`<div class="empty"><span class="empty-icon">◉</span><b>Nenhuma entrevista ainda</b><p>Comece escolhendo um candidato e um desafio. O histórico aparecerá aqui.</p>${button('newInterview','Criar primeira entrevista','btn btn-primary')}</div>`}</div></div>
<div class="stack"><div class="card"><div class="card-hd"><div><h2>Comece em 3 passos</h2><div class="card-note">Uma entrevista estruturada, sem improviso</div></div><span class="pill purple">GUIA</span></div><div class="step-card"><span class="step-number">01</span><div><b>Escolha o desafio</b><p>Filtre por senioridade, tecnologia e objetivo da vaga.</p></div></div><div class="step-card"><span class="step-number">02</span><div><b>Siga o roteiro</b><p>Conduza a sessão, revele pistas e registre evidências.</p></div></div><div class="step-card"><span class="step-number">03</span><div><b>Avalie com critérios</b><p>Preencha a rubrica e gere um relatório rastreável.</p></div></div>${button('goPlaybook','Conhecer o playbook ↗','btn btn-subtle mt')}</div>
<div class="card"><div class="card-hd"><h2>Próximas ações</h2></div>${active.length?`<p class="sm muted">${active.length} entrevista(s) ainda em andamento.</p>${button('openSession','Retomar entrevista ↗','btn btn-primary',`data-id="${esc(active[0].id)}"`)}`:`<p class="sm muted">Nenhuma entrevista em aberto. Você pode explorar o banco de desafios para planejar sua próxima avaliação.</p>${button('goChallenges','Explorar desafios ↗','btn btn-subtle')}`}</div><div class="help-text">☁ <b>Seus dados não vão para a nuvem.</b> Salvos no navegador em IndexedDB. Exporte backups regularmente em <b>Dados e versões</b>.</div></div></div>`}
function renderChallenges(){const categories=['Todos',...new Set([...CATALOG,...app.customChallenges].map(c=>c.category))];let challenges=[...CATALOG,...app.customChallenges].filter(c=>(challengeFilter.category==='Todos'||c.category===challengeFilter.category)&&(challengeFilter.level==='Todos'||c.level===challengeFilter.level)&&(!challengeFilter.q||[c.title,c.summary,c.category,...(c.tags||[])].join(' ').toLowerCase().includes(challengeFilter.q.toLowerCase())));
return `${header('DESAFIOS PRÁTICOS','Seu banco de desafios.','Problemas reais e progressivos, com roteiro de entrevista, perguntas e critérios de avaliação.',button('customChallenge','＋ Criar desafio','btn btn-primary'))}<div class="toolbar"><label class="search"><input type="search" id="filterSearch" aria-label="Buscar desafios" placeholder="Buscar por tecnologia, tema ou palavra-chave..." value="${esc(challengeFilter.q)}"></label><select id="filterCategory" class="control select" aria-label="Filtrar categoria">${categories.map(c=>`<option ${challengeFilter.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="filterLevel" class="control select" aria-label="Filtrar nível">${['Todos','Júnior','Pleno','Sênior','Tech Lead'].map(c=>`<option ${challengeFilter.level===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="split mb"><span class="muted sm"><b>${challenges.length}</b> desafios encontrados</span><span class="muted sm">${CATALOG.length} desafios originais + ${app.customChallenges.length} personalizados</span></div><div class="grid grid-3">${challenges.map(c=>`<article class="card challenge-card"><div class="challenge-top"><span class="challenge-glyph">${esc(c.icon||'◈')}</span>${levelTag(c.level)}</div><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p><div>${(c.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="challenge-actions"><div class="challenge-metadata"><span>◷ ${c.minutes} min</span><span>◫ ${esc(c.category)}</span></div>${button('challengeDetail','Ver desafio ↗','btn btn-sm btn-subtle',`data-id="${esc(c.id)}"`)}</div></article>`).join('')}</div>${!challenges.length?`<div class="card empty">Nenhum desafio corresponde aos filtros. <button class="btn btn-sm" data-action="clearFilters">Limpar filtros</button></div>`:''}`}
function renderCandidates(){return `${header('PESSOAS & PROCESSOS','Candidatos','Centralize os perfis participantes e as avaliações realizadas.',button('newCandidate','＋ Novo candidato','btn btn-primary'))}<div class="card"><div class="card-hd"><h2>Cadastro de candidatos</h2><span class="pill gray">${app.candidates.length} perfis</span></div>${app.candidates.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Candidato</th><th>Vaga / senioridade</th><th>Entrevistas</th><th>Última avaliação</th><th></th></tr></thead><tbody>${app.candidates.map(c=>{const sessions=app.sessions.filter(s=>s.candidateId===c.id);return `<tr><td><div class="t-name">${esc(c.name)}</div><div class="td-sub">${esc(c.email||'Sem e-mail')}</div></td><td>${esc(c.role||'—')}<div class="td-sub">${esc(c.level||'—')}</div></td><td>${sessions.length}</td><td>${sessions.length?scoreText(sessions.sort((a,b)=>b.startedAt.localeCompare(a.startedAt))[0]):'—'}</td><td class="nowrap">${button('startForCandidate','Entrevistar','btn btn-sm btn-subtle',`data-id="${esc(c.id)}"`)} ${button('editCandidate','Editar','btn btn-sm',`data-id="${esc(c.id)}"`)}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><span class="empty-icon">♙</span><b>Seu primeiro candidato</b><p>Cadastre um perfil com nome, vaga e senioridade, depois inicie uma entrevista.</p>${button('newCandidate','Cadastrar candidato','btn btn-primary')}</div>`}</div>`}
function renderInterview(){const s=getSession(activeSessionId);if(!s)return `${header('SALA DE ENTREVISTA','Conduza com confiança.','Cada desafio possui contexto, roteiro, perguntas e critérios consistentes.')}${app.sessions.filter(s=>s.status!=='complete').length?`<div class="card mb"><h2>Entrevistas em andamento</h2>${app.sessions.filter(s=>s.status!=='complete').map(s=>`<div class="recent-item"><div class="recent-info"><b>${esc(getCandidate(s.candidateId)?.name||'?')}</b><small>${esc(getChallenge(s.challengeId)?.title||'?')}</small></div>${button('openSession','Retomar →','btn btn-sm btn-primary',`data-id="${s.id}"`)}</div>`).join('')}</div>`:''}<div class="card empty"><span class="empty-icon">◉</span><b>Abra uma sessão de entrevista</b><p>Escolha candidato e desafio para acessar timer, editor de código e playbook.</p>${button('newInterview','Nova entrevista','btn btn-primary')}</div>`;
const c=getChallenge(s.challengeId),candidate=getCandidate(s.candidateId);if(!c)return `<div class="card">Desafio não encontrado.</div>`;
return `<div class="focus-exit">${button('toggleCandidateMode','← Voltar ao modo entrevistador','btn btn-primary')}</div><div class="interview-top"><span class="page-back">● Sessão ${short(s.id)} · ${esc(candidate?.name||'Candidato removido')}</span><div class="inline noprint">${statusBadge(s)} ${button('toggleCandidateMode','▣ Modo candidato','btn btn-sm btn-subtle')} ${button('exportOne','⇩ Exportar relatório','btn btn-sm',`data-id="${s.id}"`)} ${button('closeSession',s.status==='complete'?'Reabrir entrevista':'Finalizar entrevista','btn btn-sm btn-primary')}</div></div><div class="interview-grid"><div class="interview-main"><div class="session-header"><div class="split"><span class="overline">DESAFIO PRÁTICO ${esc(c.category.toUpperCase())}</span>${levelTag(c.level)}</div><h2>${esc(c.title)}</h2><p class="sm muted">${esc(c.summary)}</p><div class="session-meta"><span>◷ ${c.minutes} min sugeridos</span><span>♙ ${esc(candidate?.name||'?')}</span><span>◈ ${esc(s.interviewer||app.settings.interviewer)}</span><span>◴ ${dtime(s.startedAt)}</span></div></div>
<div class="timer-box"><div><div class="timer-time" id="timerDisplay">00:00</div><div class="timer-target">Duração recomendada: ${c.minutes} min</div></div><div class="inline noprint">${button('toggleTimer',s.timer.runningFrom?'Ⅱ Pausar':'▶ Iniciar','btn btn-sm btn-primary',s.status==='complete'?'disabled':'')}${button('resetTimer','↺ Zerar','btn btn-sm',s.status==='complete'?'disabled':'')}</div></div>
<div class="card"><div class="tabs noprint" role="tablist" aria-label="Conteúdo do desafio">${[['brief','Enunciado'],['code','Código'],['accept','Critérios de aceite'],['tips','Pistas']].map(([t,n])=>`<button class="tab ${sectionTab===t?'active':''}" data-action="tab" data-tab="${t}" role="tab" aria-selected="${sectionTab===t}">${n}</button>`).join('')}</div><div class="mt" id="interviewSection">${renderInterviewSection(s,c)}</div></div>
<div class="card"><div class="card-hd"><div><h2>Diário de evidências</h2><p class="card-note">Registre o que o candidato disse ou demonstrou, sem inferências.</p></div>${button('addMilestone','＋ Marco','btn btn-sm')}</div><label class="field"><span class="label">Observações do entrevistador</span><textarea id="sessionNotes" class="notes-area" placeholder="Ex.: justificou switchMap pelo descarte de requisições antigas; escreveu teste de erro; pediu esclarecimento sobre o contrato..." ${s.status==='complete'?'readonly':''}>${esc(s.notes||'')}</textarea></label><div class="inline">${button('addEvidence','＋ Registrar evidência','btn btn-sm btn-subtle',s.status==='complete'?'disabled':'')}<span class="muted tiny">Salvamento automático ativo</span></div><div class="divider"></div><div class="card-hd"><h3>Linha do tempo</h3><span class="pill gray">${s.events.length} eventos</span></div>${s.events.length? [...s.events].reverse().map(ev=>`<div class="timeline-entry"><time>${dtime(ev.at)}</time><b>${esc(ev.title)}</b>${ev.description?`<div class="muted tiny">${esc(ev.description)}</div>`:''}</div>`).join(''):'<p class="sm muted">Marcos e evidências aparecerão aqui.</p>'}</div></div>
<div class="interview-right"><div class="card"><div class="card-hd"><div><h2>Playbook do entrevistador</h2><p class="card-note">Como conduzir esta atividade</p></div><span class="pill purple">GUIADO</span></div>${c.guide.map((g,i)=>`<div class="guide-step"><div class="guide-time">ETAPA ${i+1} · ~${Math.round(c.minutes/Math.max(c.guide.length,1))} MIN</div><b>${esc(['Contexto','Exploração','Desenvolvimento','Aprofundamento'][i]||'Condução')}</b><p>${esc(g)}</p></div>`).join('')}<div class="divider"></div><h3>Perguntas para aprofundar</h3>${c.questions.map((q,i)=>`<div class="checkline"><span class="pill purple">${i+1}</span><span class="sm">${esc(q)}</span></div>`).join('')}</div>
<div class="card"><div class="card-hd"><div><h2>Avaliação por competência</h2><p class="card-note">Escala de 0 a 4 em cinco dimensões, peso igual.</p></div></div>${DIMENSIONS.map(d=>`<div class="rating-row"><div class="rating-title"><span>${esc(d.name)}</span><span class="muted tiny">${s.scores[d.key]??'—'}/4</span></div><div class="rating-description">${esc(d.desc)}</div><div class="rating-values" role="group" aria-label="${esc(d.name)}">${[0,1,2,3,4].map(n=>`<button data-action="rate" data-dim="${d.key}" data-rate="${n}" ${s.status==='complete'?'disabled':''} title="${esc(SCORE_LABELS[n])}" class="${s.scores[d.key]===n?'selected':''}" aria-pressed="${s.scores[d.key]===n}">${n}</button>`).join('')}</div></div>`).join('')}<div class="score-box mt"><div class="score-number">${totalScore(s)??'—'}<small>/100</small></div><div><strong>${totalScore(s)===null?'Avaliação incompleta':totalScore(s)>=85?'Excelente desempenho':totalScore(s)>=70?'Bom desempenho':totalScore(s)>=50?'Necessita aprofundar':'Abaixo do esperado'}</strong><p>O resultado só é calculado quando todas as dimensões recebem uma nota.</p></div></div><div class="field mt"><label for="recommendation">Parecer de avanço</label><select id="recommendation" ${s.status==='complete'?'disabled':''}>${RECOMMENDATIONS.map(v=>`<option ${s.recommendation===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="field"><label for="summary">Síntese da decisão</label><textarea id="sessionSummary" class="notes-area" style="min-height:92px" ${s.status==='complete'?'readonly':''} placeholder="Descreva evidências que sustentam o parecer...">${esc(s.summary||'')}</textarea></div>${button('closeSession',s.status==='complete'?'Reabrir':'Finalizar e gerar relatório','btn btn-primary',s.status!=='complete'&&totalScore(s)===null?'title="Complete as notas para um relatório quantitativo"':'')}</div>
<div class="card"><div class="card-hd"><h2>O que observar</h2></div>${c.signals.map(x=>`<div class="topic">${esc(x)}</div>`).join('')}<div class="divider"></div><h3>Alertas de avaliação</h3>${c.redflags.map(x=>`<div class="checkline"><span style="color:#d67b55">!</span><span class="sm muted">${esc(x)}</span></div>`).join('')}</div></div></div>`;
}
function renderInterviewSection(s,c){switch(sectionTab){case 'code':return `<div class="editor-label"><div><h3>Área de código / solução</h3><span class="muted tiny">Editor offline de texto; Angular não é compilado neste HTML.</span></div><div class="inline">${button('resetCode','Restaurar exemplo','btn btn-sm',s.status==='complete'?'disabled':'')}${c.runnable?button('runTests','▶ Executar testes JS','btn btn-sm btn-primary'):'<span class="pill gray">Avaliação manual Angular</span>'}</div></div><textarea id="codeEditor" class="editor" spellcheck="false" aria-label="Editor de código" ${s.status==='complete'?'readonly':''}>${esc(s.code??c.starter)}</textarea>${c.runnable?`<div class="runner-output mt" id="testResults"><span class="muted sm">Execute os testes para validar comportamento JavaScript nesta sessão.</span></div>`:`<div class="help-text mt">Os desafios Angular são avaliados por rubrica e evidências do entrevistador. Este arquivo offline não inclui o compilador Angular, TypeScript nem runner de TestBed. Para execução Angular real, use um projeto Angular local separado.</div>`}`;
case 'accept':return `<h3>O que a solução precisa entregar</h3>${c.criteria.map((x,i)=>`<label class="checkline"><input type="checkbox" data-criterion="${i}" ${s.criteria?.[i]?'checked':''} ${s.status==='complete'?'disabled':''}><span><b>${esc(x)}</b><p>Marque quando houver evidência objetiva de que o critério foi atendido.</p></span></label>`).join('')}`;
case 'tips':return `<h3>Pistas progressivas para destravar</h3><p class="sm muted">Use apenas se necessário. Cada pista revelada fica registrada na linha do tempo.</p>${c.hints.map((x,i)=>`<div class="hint-item"><b>Pista ${i+1}</b><div>${s.hints?.includes(i)?esc(x):'Conteúdo oculto até revelar.'}</div><div class="mt">${button('revealHint',s.hints?.includes(i)?'✓ Revelada':'Revelar pista','btn btn-sm',`data-idx="${i}" ${s.hints?.includes(i)||s.status==='complete'?'disabled':''}`)}</div></div>`).join('')}`;
default:return `<div class="prose"><h3>O cenário</h3><p>${esc(c.context)}</p><h3>Tarefas propostas</h3><ol>${c.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="callout"><b>Foco desta avaliação:</b> ${esc(c.rubricFocus)}<br>Solicite que o candidato explique premissas e trade-offs durante a execução.</div></div>`}}
function renderReports(){if(activeReportId){const s=getSession(activeReportId);if(s)return reportDetail(s)}return `${header('DECISÕES BASEADAS EM EVIDÊNCIAS','Avaliações','Compare resultados e registre a recomendação do entrevistador sem depender de memória.',button('exportAllReports','⇩ Exportar relatórios CSV','btn'))}<div class="card"><div class="card-hd"><h2>Relatórios gerados</h2><span class="pill gray">${app.sessions.length} sessões</span></div>${app.sessions.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Candidato</th><th>Desafio</th><th>Data</th><th>Status</th><th>Nota</th><th>Parecer</th><th></th></tr></thead><tbody>${[...app.sessions].sort((a,b)=>b.startedAt.localeCompare(a.startedAt)).map(s=>`<tr><td><b>${esc(getCandidate(s.candidateId)?.name||'Candidato removido')}</b></td><td>${esc(getChallenge(s.challengeId)?.title||'Desafio removido')}</td><td>${dt(s.startedAt)}</td><td>${statusBadge(s)}</td><td><strong>${esc(scoreText(s))}</strong></td><td>${esc(s.recommendation||'Não avaliado')}</td><td>${button('viewReport','Ver relatório ↗','btn btn-sm btn-subtle',`data-id="${s.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><span class="empty-icon">▤</span><b>Sem avaliações por enquanto</b><p>Os relatórios aparecerão após a criação de uma sessão, mesmo se ela ainda estiver em andamento.</p>${button('newInterview','Iniciar avaliação','btn btn-primary')}</div>`}</div>`}
function reportDetail(s){const c=getCandidate(s.candidateId),challenge=getChallenge(s.challengeId),v=totalScore(s);return `${header('RELATÓRIO DE AVALIAÇÃO','Parecer técnico','Resumo estruturado de competências, observações e evidências.',button('backReports','← Todos','btn')+button('printReport','⎙ Imprimir / PDF','btn')+button('exportOne','⇩ Exportar JSON','btn btn-primary',`data-id="${s.id}"`))}<article class="card print-report"><div class="report-head"><div><div class="eyebrow">BRAARENA / TECHNICAL INTERVIEW</div><h2>${esc(c?.name||'Candidato removido')}</h2><p class="sm muted">${esc(c?.role||'Vaga não informada')} · ${esc(c?.level||'Nível não informado')}</p><div class="inline mt">${statusBadge(s)}${levelTag(challenge?.level||'Nível não informado')}<span class="pill gray">${dt(s.startedAt)}</span></div></div><div class="text-end"><div class="report-score">${v??'—'}<span>/100</span></div><small class="muted">Pontuação da rubrica</small></div></div>
<div class="grid grid-3"><div class="statbox"><small>DESAFIO</small><strong style="font-size:14px">${esc(challenge?.title||'Excluído')}</strong></div><div class="statbox"><small>ENTREVISTADOR</small><strong style="font-size:14px">${esc(s.interviewer||'Não informado')}</strong></div><div class="statbox"><small>DECISÃO</small><strong style="font-size:14px">${esc(s.recommendation||'Não avaliado')}</strong></div></div>
<div class="report-section"><h3>Competências avaliadas</h3>${DIMENSIONS.map(d=>{const n=s.scores[d.key];return `<div class="report-dimension"><b>${esc(d.name)}</b><div class="progressbar"><span style="width:${(n??0)*25}%"></span></div><span class="muted tiny">${n??'—'}/4</span></div>`}).join('')}<p class="muted tiny mt">Escala comportamental: 0 não demonstrou, 1 insuficiente, 2 parcial, 3 bom, 4 excelente. Pontuação = soma das 5 dimensões × 5. Sem nota completa, resultado indisponível.</p></div>
<div class="report-section"><h3>Síntese técnica e evidências</h3><div class="evidence-note">${esc(s.summary?.trim()||'Nenhuma síntese registrada.')}</div><h3 class="mt">Anotações do entrevistador</h3><div class="evidence-note">${esc(s.notes?.trim()||'Nenhuma anotação registrada.')}</div></div>
<div class="report-section"><h3>Critérios verificados</h3>${(challenge?.criteria||[]).map((x,i)=>`<div class="topic" style="color:${s.criteria?.[i]?'#268965':'#959cab'}">${s.criteria?.[i]?'☑':'☐'} ${esc(x)}</div>`).join('')}</div>
<div class="report-section"><h3>Registro da sessão</h3>${s.events.map(ev=>`<div class="recent-item"><div class="recent-info"><b>${esc(ev.title)}</b><small>${dtime(ev.at)}${ev.description?' · '+esc(ev.description):''}</small></div></div>`).join('')||'<p class="muted sm">Sem marcos registrados.</p>'}</div>
<div class="divider"></div><div class="split tiny muted"><span>BraArena · Avaliação local · Documento produzido por um entrevistador</span><span>Sessão ${short(s.id)} · Gerado em ${dtime(now())}</span></div></article>`}

function renderRepository(){const folder=rt.folderHandle,versions=[...rt.commits].sort((a,b)=>b.timestamp.localeCompare(a.timestamp)),syncLabel=rt.browserConflict?'Conflito entre abas do navegador':rt.conflict?'Conflitos pendentes':!folder?'Somente no navegador':rt.dirty?'Alterações locais não versionadas':rt.remoteHead===rt.baseCommit&&rt.localHead===rt.baseCommit?'Versões alinhadas':'Versão local ainda não publicada';return `${header('LOCAL-FIRST & BACKUP','Seus dados, sob seu controle.','Cópia de trabalho no navegador, versões imutáveis e opção de publicar em pasta local.',button('createVersion','＋ Salvar versão local','btn btn-primary'))}
<div class="repo-status ${rt.conflict||rt.dirty?'warn':''}"><span style="font-size:22px">${rt.conflict?'⚠':'◈'}</span><div><strong>${syncLabel}</strong><small>${folder?`Pasta conhecida: ${esc(folder.name)}. ${rt.baseCommit?'Última publicação '+short(rt.baseCommit):'Nenhuma publicação confirmada neste navegador.'}`:'Escolha uma pasta para publicar commits, refs e snapshots ou exporte um backup JSON.'}</small></div></div>
${renderBrowserConflict()}${rt.conflict?`<div class="card mt" style="border-color:#f1be86"><div class="card-hd"><h2>⚠ Resolver divergência antes de publicar</h2><span class="pill orange">${rt.conflict.conflicts.length} conflitos</span></div><p class="sm muted">Mudanças independentes são combinadas automaticamente. Para alterações no mesmo campo, escolha qual valor manter. Nenhum dado remoto será publicado até a resolução.</p>${rt.conflict.conflicts.map((c,i)=>`<div class="guide-step"><div class="split"><b>Conflito ${i+1}: ${esc(c.path)}</b><span class="pill">${esc(c.type)}</span></div><div class="grid grid-2 mt"><div><div class="label">Minha versão</div><pre class="help-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(c.localValue))}</pre></div><div><div class="label">Versão da pasta</div><pre class="help-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(c.remoteValue))}</pre></div></div><div class="inline mt">${button('resolveConflict',c.choice==='local'?'✓ Usar minha versão':'Usar minha versão','btn btn-sm '+(c.choice==='local'?'btn-primary':''),`data-id="${i}" data-choice="local"`)}${button('resolveConflict',c.choice==='remote'?'✓ Usar versão da pasta':'Usar versão da pasta','btn btn-sm '+(c.choice==='remote'?'btn-primary':''),`data-id="${i}" data-choice="remote"`)}</div></div>`).join('')}<div class="inline">${button('finishConflict','Integrar e publicar mudanças','btn btn-primary',rt.conflict.conflicts.every(c=>c.choice)?'':'disabled')}${button('abandonConflict','Manter local e cancelar integração','btn btn-red')}</div></div>`:''}
<div class="repo-grid mt"><div class="stack"><div class="card"><div class="card-hd"><div><h2>Persistência e exportação</h2><p class="card-note">Salve dados com redundância para não perder entrevistas</p></div></div><div class="step-card"><div class="step-number">1</div><div style="flex:1"><b>IndexedDB no navegador</b><p>Autosave de candidatos, desafios, avaliações, código e notas. Funciona offline, neste navegador e dispositivo.</p></div>${eBadge(rt.saveFailed?'ERRO':'ATIVO',rt.saveFailed?'red':'green')}</div><div class="step-card"><div class="step-number">2</div><div style="flex:1"><b>Arquivo JSON de backup</b><p>Exportação portátil contendo dados e histórico local de versões; pode ser restaurada em outro dispositivo.</p><div class="inline mt">${button('exportBackup','⇩ Exportar backup completo','btn btn-sm btn-subtle')}${button('importBackup','⇧ Importar backup','btn btn-sm')}</div></div></div><div class="step-card"><div class="step-number">3</div><div style="flex:1"><b>Repositório em pasta local</b><p>Publica <span class="codeword">manifest.json</span>, <span class="codeword">refs/main.json</span>, <span class="codeword">commits/</span> e <span class="codeword">snapshots/</span>. Disponível em navegadores compatíveis com File System Access.</p><div class="inline mt">${button(folder?'reconnectFolder':'chooseFolder',folder?'♧ Permitir acesso / reconectar':'▣ Escolher pasta','btn btn-sm btn-subtle')}${folder?button('chooseFolder','Alterar pasta','btn btn-sm'):''}${button('publishFolder','⇧ Publicar versão na pasta','btn btn-sm btn-primary',folder?'':'disabled')}${folder?button('checkFolder','↻ Verificar versão da pasta','btn btn-sm'):''}</div></div></div><div class="note-yellow mt"><b>Limite de concorrência:</b> uma pasta local não oferece compare-and-swap atômico. Esta versão é destinada a um único responsável por publicação por vez. Ela verifica divergências antes de gravar e oferece mesclagem por campo, mas <b>não promete sincronização multiusuário livre de corridas</b>. Use pasta individual ou coordene as publicações.</div></div>
<div class="card"><div class="card-hd"><h2>Restaurar com segurança</h2></div><p class="sm muted">A restauração de uma versão local cria uma nova versão e mantém o histórico. Não exclui o registro anterior.</p>${versions.length?versions.slice(0,12).map(c=>`<div class="version-entry"><div><b>${esc(c.message||'Versão local')}</b><small>${dtime(c.timestamp)} · ${short(c.id)} · ${c.parent?.length||0} ancestral(is)</small></div>${button('restoreVersion','Restaurar','btn btn-sm',`data-id="${esc(c.id)}"`)}</div>`).join(''):`<div class="empty"><span class="empty-icon">◷</span><b>Ainda não há versões</b><p>Use “Salvar versão local” para criar um ponto de restauração auditável.</p></div>`}</div></div>
<div class="stack"><div class="card"><h2>Estado do repositório</h2><div class="step-card"><div class="step-number">⌁</div><div><b>ID do repositório</b><p class="mono">${esc(app.repositoryId)}</p></div></div><div class="step-card"><div class="step-number">↳</div><div><b>Último commit local</b><p class="mono">${esc(short(rt.localHead)||'Ainda não criado')}</p></div></div><div class="step-card"><div class="step-number">⇧</div><div><b>Última base publicada</b><p class="mono">${esc(short(rt.baseCommit)||'Não publicado')}</p></div></div><div class="step-card"><div class="step-number">□</div><div><b>Local de publicação</b><p>${esc(folder?.name||'Não vinculado')}</p></div></div><div class="divider"></div><div class="inline">${button('createVersion','Salvar versão agora','btn btn-primary')}${button('exportBackup','Fazer backup','btn')}</div></div>
<div class="card"><h2>Como funciona</h2><p class="sm muted">Edição não bloqueante, com rastreio de versões e recuperação em caso de falha de acesso.</p>${['Edições sempre começam na working copy do navegador.','Cada versão possui ID, ancestral, timestamp, snapshot e hash SHA-256 quando o navegador permite.','Publicação lê a referência remota, compara a base e bloqueia conflito sem escolha humana.','Perder acesso à pasta não apaga a cópia local.','Importar um backup exige confirmação explícita.'].map(x=>`<div class="topic">${esc(x)}</div>`).join('')}</div><div class="card"><h2>Cuidados com dados de candidatos</h2><p class="sm muted">Os registros podem conter dados pessoais. Evite usar computadores compartilhados, mantenha backups em pasta de acesso restrito e respeite as políticas de retenção da sua organização. A aplicação offline não oferece criptografia de dados em repouso nem controle de acesso por usuário.</p><div class="divider"></div>${button('clearWorkspace','Reiniciar espaço de trabalho','btn btn-sm btn-red')}</div></div></div>`}
function toast(message,err=false){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=message;$('toastArea').append(d);setTimeout(()=>d.remove(),4600)}
function openModal(html){$('modalBody').innerHTML=html;$('modal').showModal()}

function modalHeader(title,subtitle=''){return `<div class="modal-hd"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close-modal" data-action="closeModal" aria-label="Fechar">×</button></div>`}
function candidateModal(existing=null){const c=existing||{name:'',email:'',role:app.settings.defaultRole||'',level:'Sênior',city:'',notes:''};openModal(`${modalHeader(existing?'Editar candidato':'Novo candidato','Dados mínimos para conduzir entrevistas estruturadas.')}<form id="candidateForm"><input type="hidden" name="id" value="${esc(existing?.id||'')}"><div class="field"><label>Nome completo *</label><input name="name" required maxlength="120" value="${esc(c.name)}" placeholder="Ex.: Maria Oliveira"></div><div class="form-row"><div class="field"><label>E-mail (opcional)</label><input name="email" type="email" maxlength="150" value="${esc(c.email)}" placeholder="maria@exemplo.com"></div><div class="field"><label>Cidade</label><input name="city" maxlength="70" value="${esc(c.city||'')}" placeholder="São Paulo"></div></div><div class="form-row"><div class="field"><label>Vaga</label><input name="role" maxlength="120" value="${esc(c.role||'')}"></div><div class="field"><label>Senioridade</label><select name="level">${['Júnior','Pleno','Sênior','Tech Lead'].map(level=>`<option ${c.level===level?'selected':''}>${level}</option>`).join('')}</select></div></div><div class="field"><label>Notas do recrutamento (opcional)</label><textarea name="notes" maxlength="3000" placeholder="Informações relevantes para preparação">${esc(c.notes||'')}</textarea></div><div class="modal-footer">${existing?button('deleteCandidate','Excluir perfil','btn btn-red',`data-id="${existing.id}" style="margin-right:auto"`):''}<button type="button" class="btn" data-action="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">Salvar candidato</button></div></form>`)}
function newInterviewModal(preCandidateId='',preChallengeId=''){if(!app.candidates.length){candidateModal();toast('Cadastre primeiro um candidato para iniciar a entrevista.');return}const selected=preChallengeId||'a01';openModal(`${modalHeader('Nova entrevista','Escolha o candidato e o desafio. O progresso será registrado automaticamente.')}<form id="interviewForm"><div class="field"><label>Candidato *</label><select name="candidateId" required>${app.candidates.map(c=>`<option value="${c.id}" ${c.id===preCandidateId?'selected':''}>${esc(c.name)} · ${esc(c.role||c.level)}</option>`).join('')}</select></div><div class="field"><label>Desafio *</label><select name="challengeId" required>${[...CATALOG,...app.customChallenges].map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.title)} · ${esc(c.level)} · ${c.minutes} min</option>`).join('')}</select></div><div class="field"><label>Entrevistador responsável</label><input name="interviewer" required value="${esc(app.settings.interviewer)}" maxlength="90"></div><div class="note-yellow">O cronômetro será iniciado manualmente. O conteúdo do editor e as notas são salvos no navegador. Entrevistas não são gravadas por áudio ou vídeo.</div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">Criar sessão ↗</button></div></form>`)}
function customChallengeModal(){openModal(`${modalHeader('Criar desafio personalizado','Adicione um cenário próprio com roteiro e critérios de avaliação.')}<form id="challengeForm"><div class="field"><label>Título *</label><input name="title" required maxlength="110" placeholder="Ex.: Arquitetura de extrato em tempo real"></div><div class="form-row"><div class="field"><label>Área</label><select name="category">${['Angular','Arquitetura','Performance','Qualidade','Tech Lead','JavaScript'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Dificuldade</label><select name="level">${['Júnior','Pleno','Sênior','Tech Lead'].map(x=>`<option ${x==='Sênior'?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Duração em minutos</label><input name="minutes" type="number" min="5" max="180" value="30" required></div><div class="field"><label>Resumo *</label><textarea name="summary" required maxlength="400"></textarea></div><div class="field"><label>Cenário do desafio *</label><textarea name="context" required maxlength="4000" placeholder="Descreva o contexto técnico e de negócio..."></textarea></div><div class="field"><label>Tarefas (uma por linha) *</label><textarea name="tasks" required placeholder="Modelar o estado\nConsumir uma API\nTestar uma condição de corrida"></textarea></div><div class="field"><label>Critérios de aceite (um por linha) *</label><textarea name="criteria" required></textarea></div><div class="field"><label>Perguntas de aprofundamento (uma por linha)</label><textarea name="questions"></textarea></div><div class="field"><label>Código inicial (opcional)</label><textarea name="starter" class="mono" style="min-height:120px"></textarea></div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">Criar desafio</button></div></form>`)}
function detailModal(id){const c=getChallenge(id);if(!c)return;activeChallengeId=id;openModal(`${modalHeader(c.title,c.summary)}<div class="inline mb">${levelTag(c.level)} ${eBadge(c.category,'gray')} ${eBadge(c.minutes+' min','gray')}</div><div class="prose"><h3>Cenário</h3><p>${esc(c.context)}</p><h3>O que será avaliado</h3><ol>${c.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><h3>Critérios de aceite</h3><ul>${c.criteria.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>Perguntas para o entrevistador</h3><ul>${c.questions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div class="modal-footer">${c.source==='custom'?button('removeCustom','Excluir desafio','btn btn-red',`data-id="${c.id}" style="margin-right:auto"`):''}<button class="btn" data-action="closeModal">Voltar</button>${button('startWithChallenge','Aplicar este desafio ↗','btn btn-primary',`data-id="${c.id}"`)}</div>`)}
function evidenceModal(type='evidence'){openModal(`${modalHeader(type==='evidence'?'Registrar evidência':'Registrar marco','Adicione um registro pontual à linha do tempo da entrevista.')}<form id="eventForm"><input name="type" type="hidden" value="${type}"><div class="field"><label>Título *</label><input name="title" required maxlength="140" placeholder="Ex.: Identificou condição de corrida"></div><div class="field"><label>Descrição / citação</label><textarea name="description" maxlength="3000" placeholder="Qual evidência concreta foi observada?"></textarea></div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">Registrar</button></div></form>`)}
function settingsModal(){openModal(`${modalHeader('Configurações do espaço','Preferências salvas neste dispositivo.')}<form id="settingsForm"><div class="field"><label>Nome do entrevistador</label><input name="interviewer" value="${esc(app.settings.interviewer)}" required maxlength="90"></div><div class="field"><label>Organização</label><input name="organization" value="${esc(app.settings.organization)}" maxlength="90"></div><div class="field"><label>Vaga padrão</label><input name="defaultRole" value="${esc(app.settings.defaultRole)}" maxlength="110"></div><div class="modal-footer"><button type="button" class="btn" data-action="closeModal">Cancelar</button><button type="submit" class="btn btn-primary">Salvar preferências</button></div></form>`)}
function createSession(data){const c=getChallenge(data.challengeId);if(!c||!getCandidate(data.candidateId))throw Error('Candidato ou desafio inválido');const s={id:uid(),candidateId:data.candidateId,challengeId:c.id,interviewer:data.interviewer.trim(),startedAt:now(),endedAt:null,status:'in_progress',notes:'',summary:'',recommendation:'Não avaliado',scores:{},code:c.starter,criteria:{},hints:[],events:[{id:uid(),at:now(),title:'Entrevista iniciada',description:`Desafio: ${c.title}`}],timer:{accumulatedMs:0,runningFrom:null},lastTest:null};app.sessions.push(s);activeSessionId=s.id;markDirty();closeModal();navigate('interview');toast('Sessão criada e salva localmente.')}
function toggleTimer(reset=false){const s=getSession(activeSessionId);if(!s||s.status==='complete')return;const t=s.timer;if(reset){if(!confirm('Zerar o cronômetro desta sessão?'))return;t.accumulatedMs=0;t.runningFrom=null}else if(t.runningFrom){t.accumulatedMs+=Date.now()-Date.parse(t.runningFrom);t.runningFrom=null;s.events.push({id:uid(),at:now(),title:'Cronômetro pausado'})}else{t.runningFrom=now();s.events.push({id:uid(),at:now(),title:'Cronômetro iniciado'})}markDirty();render()}
function updateClock(){const s=getSession(activeSessionId);if(!s||!$('timerDisplay'))return;const t=s.timer;const elapsed=Math.max(0,(t.accumulatedMs||0)+(t.runningFrom?Date.now()-new Date(t.runningFrom).getTime():0));const sec=Math.floor(elapsed/1000),hrs=Math.floor(sec/3600),mins=Math.floor(sec/60)%60;$('timerDisplay').textContent=hrs?`${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;$('timerDisplay').style.color=elapsed>getChallenge(s.challengeId).minutes*60000?'#ffc592':''}
function closeSession(){const s=getSession(activeSessionId);if(!s)return;if(s.status==='complete'){if(!confirm('Reabrir esta entrevista? O parecer anterior será mantido.'))return;s.status='in_progress';s.endedAt=null;s.events.push({id:uid(),at:now(),title:'Entrevista reaberta'})}else{if(!confirm(totalScore(s)===null?'Há competências sem nota. Finalizar mesmo assim?':'Finalizar entrevista e registrar o parecer?'))return;if(s.timer.runningFrom){s.timer.accumulatedMs+=Date.now()-Date.parse(s.timer.runningFrom);s.timer.runningFrom=null}s.status='complete';s.endedAt=now();s.events.push({id:uid(),at:now(),title:'Entrevista finalizada',description:scoreText(s)})}markDirty();render();toast(s.status==='complete'?'Entrevista finalizada. Relatório disponível.':'Entrevista reaberta.')}
function download(name,content,mime='application/json;charset=utf-8'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),45000)}
async function exportBackup(){await commitState();const backup={format:'braarena-backup',backupVersion:1,exportedAt:now(),app:jsonClone(app),localHead:rt.localHead,baseCommit:rt.baseCommit,commits:await allObjs('commits'),snapshots:await allObjs('snapshots')};backup.integrity={algorithm:'SHA-256',checksum:await sha256(JSON.stringify(backup))};download('braarena-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(backup,null,2));toast('Backup completo exportado em JSON.')}

case 'challengeDetail':detailModal(id);break;
case 'customChallenge':customChallengeModal();break;
case 'removeCustom':{if(app.sessions.some(s=>s.challengeId===id)){toast('Não é possível excluir um desafio usado em avaliações.',true);break}if(confirm('Excluir este desafio personalizado?')){app.customChallenges=app.customChallenges.filter(c=>c.id!==id);markDirty();closeModal();render()}break}
case 'clearFilters':challengeFilter={q:'',category:'Todos',level:'Todos'};render();break;
case 'goChallenges':navigate('challenges');break;
case 'goPlaybook':navigate('playbook');break;
case 'goReports':activeReportId=null;navigate('reports');break;
case 'openSession':activeSessionId=id;await kvPut('activeSessionId',id);sectionTab='brief';navigate('interview');break;
case 'tab':sectionTab=b.dataset.tab;render();break;
case 'toggleTimer':toggleTimer();break;
case 'resetTimer':toggleTimer(true);break;
case 'toggleCandidateMode':candidateMode=!candidateMode;render();break;
case 'closeSession':closeSession();break;
case 'addMilestone':evidenceModal('milestone');break;
case 'addEvidence':evidenceModal('evidence');break;
case 'rate':{const s=getSession(activeSessionId);if(!s||s.status==='complete')break;s.scores[b.dataset.dim]=Number(b.dataset.rate);markDirty();const y=window.scrollY;render();window.scrollTo(0,y);break}
case 'revealHint':{const s=getSession(activeSessionId);if(!s||s.status==='complete')break;const i=Number(b.dataset.idx),c=getChallenge(s.challengeId);if(!Number.isInteger(i)||!c.hints[i])break;s.hints.push(i);s.events.push({id:uid(),at:now(),title:`Pista ${i+1} revelada`});markDirty();render();break}
case 'resetCode':{const s=getSession(activeSessionId);if(!s||s.status==='complete')break;if(confirm('Restaurar código inicial? O código atual será substituído; salve uma versão antes se necessário.')){s.code=getChallenge(s.challengeId).starter;markDirty();render()}break}
case 'runTests':runnerTest();break;
case 'viewReport':activeReportId=id;navigate('reports');break;
case 'backReports':activeReportId=null;render();break;
case 'printReport':window.print();break;
case 'exportOne':exportOne(id||activeSessionId);break;
case 'exportAllReports':exportAllReports();break;
case 'exportBackup':await exportBackup();break;
case 'importBackup':$('importInput').click();break;
case 'createVersion':{const m=prompt('Nome para esta versão:',`Entrevistas e desafios · ${new Date().toLocaleDateString('pt-BR')}`);if(m===null)break;const c=await saveVersion(m||'Snapshot local');toast('Versão local salva: '+short(c.id));render();break}
case 'restoreVersion':await restoreVersion(id);break;
case 'chooseFolder':await chooseFolder();break;
case 'reconnectFolder':await reconnectFolder();break;
case 'publishFolder':await publishFolder();break;
case 'checkFolder':await checkFolder();break;
case 'resolveBrowserConflict':{if(!rt.browserConflict)break;const i=Number(id);if(rt.browserConflict.conflicts[i])rt.browserConflict.conflicts[i].choice=b.dataset.choice;await pendingBackup();render();break}
case 'finishBrowserConflict':await finishBrowserConflict();break;
case 'resolveConflict':{if(!rt.conflict)break;const i=Number(id);if(rt.conflict.conflicts[i])rt.conflict.conflicts[i].choice=b.dataset.choice;await kvPut('conflict',rt.conflict);render();break}
case 'finishConflict':await finishConflict();break;
case 'abandonConflict':if(confirm('Cancelar a integração? Nenhum dado local será apagado.')){rt.conflict=null;await kvPut('conflict',null);render()}break;
case 'clearWorkspace':await clearWorkspace();break;
}}catch(err){console.error(err);toast('Ação não concluída: '+err.message,true)}});
}
init();

function renderBrowserConflict(){if(!rt.browserConflict)return '';const c=rt.browserConflict;return `<section class="card mt" style="border-color:#f1be86"><div class="card-hd"><h2>⚠ Conflito entre abas abertas</h2>${eBadge(c.conflicts.length+' campo(s)','orange')}</div><p class="sm muted">Outra aba salvou alterações enquanto você editava. Sua versão não foi sobrescrita e foi preservada como recuperação local. Decida o valor de cada campo ou exporte um backup antes de continuar. Não feche esta aba sem resolver ou exportar.</p>${c.conflicts.map((x,i)=>`<div class="guide-step"><b>${esc(x.path)}</b><div class="grid grid-2 mt"><div><div class="label">Esta aba</div><pre class="help-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(x.localValue))}</pre></div><div><div class="label">Outra aba</div><pre class="help-text" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(JSON.stringify(x.remoteValue))}</pre></div></div><div class="inline mt">${button('resolveBrowserConflict',x.choice==='local'?'✓ Manter esta aba':'Manter esta aba','btn btn-sm '+(x.choice==='local'?'btn-primary':''),`data-id="${i}" data-choice="local"`)}${button('resolveBrowserConflict',x.choice==='remote'?'✓ Manter outra aba':'Manter outra aba','btn btn-sm '+(x.choice==='remote'?'btn-primary':''),`data-id="${i}" data-choice="remote"`)}</div></div>`).join('')}<div class="inline">${button('finishBrowserConflict','Resolver e salvar no navegador','btn btn-primary',c.conflicts.every(i=>i.choice)?'':'disabled')}${button('exportBackup','⇩ Exportar cópia atual','btn btn-subtle')}</div></section>`}
async function finishBrowserConflict(){const c=rt.browserConflict;if(!c||c.conflicts.some(x=>!x.choice))return;const latest=await kvGet('app'),revision=await kvGet('revision')||null;const choices=Object.fromEntries(c.conflicts.map(x=>[x.path,x.choice]));if(revision!==c.remoteRevision){const conflicts=[];mergeValue(c.base,app,latest,'',conflicts);rt.browserConflict={base:c.base,local:jsonClone(app),remote:latest,remoteRevision:revision,conflicts};await pendingBackup();render();toast('Outra aba mudou novamente. Reavalie os conflitos.',true);return}const conflicts=[];const merged=mergeValue(c.base,app,latest,'',conflicts,choices);if(conflicts.length)throw Error('Ainda existem conflitos sem resolução');if(!validateApp(merged))throw Error('Resultado da mesclagem inválido');app=merged;rt.browserRevision=revision;rt.browserBaseState=jsonClone(latest);rt.browserConflict=null;rt.dirty=true;await commitState();render();toast('Conflito entre abas resolvido e alterações salvas.')}
</script>
</body></html>
