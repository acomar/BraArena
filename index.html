ght:750;letter-spacing:.2px;background:#e9eef7;color:#425473;border-radius:5px;padding:3px 6px;margin-top:9px;margin-right:3px}.tag.blue{color:#1c47b8;background:#dbe7ff}.side ol{color:#56657c;font-size:12px;padding-left:17px;line-height:1.7;margin:10px 0}.guide h3{font-size:12px;color:#324763;margin:17px 0 7px}.guide ul{padding-left:17px;margin:0;color:#485975;font-size:12px;line-height:1.65}.guide li{margin-bottom:7px}.guide .hint{padding:11px;background:#f4f8fe;border-radius:9px;margin-top:15px;font-size:12px;color:#425878}.center{min-width:0;overflow:hidden}.tabline{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:0 15px}.tabs{display:flex;gap:1px;overflow:auto}.tab{background:transparent;border:0;border-bottom:3px solid transparent;color:#64738b;padding:15px 14px;font-weight:700;white-space:nowrap}.tab.active{border-color:var(--blue);color:var(--blue)}.tab-main{padding:18px}.section-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}.section-top h2{font-size:16px}.section-top p{font-size:12px;margin-top:4px}.editor{height:510px;min-height:320px;width:100%;resize:vertical;border:1px solid #28344b;background:#121b2d;color:#d5e3ff;border-radius:11px;padding:19px;font:12.3px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}.banner{border-radius:10px;background:#eef4ff;padding:12px 14px;color:#425b87;font-size:12px;border:1px solid #dae6fe;margin:10px 0}.banner.warn{background:#fff8e9;border-color:#f0dbac;color:#775513}.compiler-host{height:640px;min-height:500px;background:#101827;border-radius:10px;overflow:hidden;position:relative}.compiler-host iframe{height:100%!important;width:100%!important;border:0!important}.compiler-wait{position:absolute;inset:0;display:grid;place-content:center;color:white;text-align:center;gap:8px;pointer-events:none}.compiler-wait small{color:#b7c4d8}.toolrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolrow .tool{min-width:40px}.tool.active{color:#173eb5;background:#e4edff;border-color:#8baaff}.whiteboard-wrap{position:relative;background:white;border:1px solid #ccd7e9;border-radius:11px;overflow:hidden}.whiteboard-canvas{display:block;width:100%;height:530px;background-color:#fff;background-image:radial-gradient(#e0e5ee 1px,transparent 1px);background-size:18px 18px;touch-action:none;cursor:crosshair}.colorinput{width:35px;height:35px;padding:2px;border:1px solid #cbd5e3;border-radius:8px;background:white;cursor:pointer}.board-fullscreen{position:fixed;inset:0;z-index:90;background:white;padding:18px;display:flex;flex-direction:column}.board-fullscreen .whiteboard-wrap{flex:1;min-height:0}.board-fullscreen .whiteboard-canvas{height:100%}.score-grid{display:grid;gap:9px}.score-item{border:1px solid var(--border);border-radius:11px;padding:13px}.score-label{display:flex;justify-content:space-between;gap:10px}.score-label strong{font-size:13px}.score-values{display:flex;gap:6px;margin-top:8px}.score-btn{width:37px;height:34px;border:1px solid #cfdaeb;border-radius:8px;background:#fff;color:#51617b;font-weight:700}.score-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}.scoreline{display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center;margin:14px 0}.result-box{background:#f1f5ff;border:1px solid #dce6ff;border-radius:11px;padding:16px}.score-total{font-size:29px;font-weight:800;letter-spacing:-1px;color:#3157dc}.savehint{color:#66768e;font-size:11px;margin-left:auto}.overlay{position:fixed;inset:0;background:#0a142bbd;z-index:110;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:white;border-radius:16px;width:min(780px,100%);max-height:93vh;overflow:auto;border:1px solid #ccd4e3;box-shadow:0 20px 70px #0b1a3240}.modal-head{position:sticky;top:0;background:white;z-index:1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding:17px 22px}.modal-head h2{font-size:18px}.modal-body{padding:21px}.separator{border:0;border-top:1px solid #e2e7ef;margin:18px 0}.history-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #e9edf4}.history-row strong{font-size:12px;display:block}.history-row small{display:block}.status-box{background:#f7f9fd;border:1px solid #e0e7f0;border-radius:10px;padding:12px;font-size:12px}.field2{display:grid;gap:12px}.danger-note{font-size:12px;color:#a34b47}.toast{position:fixed;right:20px;bottom:20px;z-index:150;background:#14351e;color:white;box-shadow:0 9px 35px #0003;border-radius:11px;padding:12px 17px;font-size:13px;max-width:360px}.conflictrow{border:1px solid #e7ccbd;border-radius:10px;background:#fffaf7;padding:13px;margin:8px 0}.conflictrow h3{font-size:12px}.conflictrow pre{font-size:11px;max-height:65px;white-space:pre-wrap;overflow:auto}.conflictrow .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.conflictrow label{font-size:12px}.footer-note{font-size:11px;color:#66748a;margin-top:13px}.right-actions{display:flex;gap:8px;flex-wrap:wrap}.empty-state{padding:30px;text-align:center;color:#64738b}.info-icon{display:grid;place-items:center;background:#ecf1ff;color:#2d56cf;border-radius:12px;height:48px;width:48px;font-size:22px;margin:0 auto 12px}.only-mobile{display:none}

<script>const CATALOG=[{"id":"signals","name":"Filtros com Signals","tag":"Angular","level":"Pleno","time":25,"goal":"Implementar filtros combinados e estado derivado sem efeitos colaterais.","task":"A lista deve responder simultaneamente à busca e ao status, incluindo estado vazio.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal, computed, ChangeDetectionStrategy } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n\ninterface Solicitacao { id: number; cliente: string; status: 'pendente' | 'aprovada' | 'rejeitada'; valor: number }\n\n@Component({\n selector: 'app-root', standalone: true,\n changeDetection: ChangeDetectionStrategy.OnPush,\n template: `<main style=\"font-family:system-ui;padding:28px;max-width:780px;margin:auto\">\n <h1>Solicitações de crédito</h1>\n <p>Implemente uma busca por cliente e um filtro de status que funcionem juntos.</p>\n <input aria-label=\"Buscar cliente\" placeholder=\"Buscar cliente\" (input)=\"busca.set($any($event.target).value)\" />\n <select aria-label=\"Filtrar status\" (change)=\"status.set($any($event.target).value)\">\n <option value=\"todos\">Todos</option><option value=\"pendente\">Pendente</option><option value=\"aprovada\">Aprovada</option><option value=\"rejeitada\">Rejeitada</option>\n </select>\n <p>{{ resultados().length }} resultado(s)</p>\n @for (item of resultados(); track item.id) {\n <article style=\"padding:12px;border:1px solid #ccd;margin:8px 0;border-radius:8px\">\n <strong>{{item.cliente}}</strong> · {{item.status}} · R$ {{item.valor}}\n </article>\n } @empty { <p>Nenhum resultado.</p> }\n </main>`\n})\nexport class AppComponent {\n readonly itens = signal<Solicitacao[]>([\n  {id:1,cliente:'Ana Lima',status:'pendente',valor:1200},\n  {id:2,cliente:'Bruno Dias',status:'aprovada',valor:3400},\n  {id:3,cliente:'Clara Souza',status:'rejeitada',valor:900}\n ]);\n readonly busca = signal('');\n readonly status = signal('todos');\n readonly resultados = computed(() => this.itens()); // TODO: aplique os dois filtros sem mutar a origem\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Peça o raciocínio antes do código.","Dê 15 minutos para a implementação.","Peça um caso de borda e um teste."],"questions":["Por que computed e não um método no template?","Qual a diferença entre signal, computed e effect?","Como testaria os filtros combinados?"],"observations":["Tipos seguros, imutabilidade e reatividade","Simplicidade, testes e tratamento de vazio"]},{"id":"rx","name":"Autocomplete com RxJS","tag":"RxJS","level":"Pleno","time":25,"goal":"Avaliar composição assíncrona, debounce e cancelamento.","task":"Evolua a busca para estados loading/erro, e explique como evitar respostas obsoletas.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, OnDestroy } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\nimport { Subject, debounceTime, distinctUntilChanged, switchMap, of, delay, Subscription } from 'rxjs';\n\n@Component({selector:'app-root',standalone:true,\n template:`<main style=\"font-family:system-ui;padding:28px\"><h1>Busca de produtos</h1>\n <input aria-label=\"Buscar\" (input)=\"buscar($any($event.target).value)\" placeholder=\"Produto\" />\n <p>{{status}}</p>\n <ul>@for (x of resultados;track x) {<li>{{x}}</li>}</ul>\n </main>`})\nexport class AppComponent implements OnDestroy {\n private entrada = new Subject<string>();\n private sub:Subscription;\n resultados:string[]=[];status='Digite para buscar';\n constructor(){ this.sub=this.entrada.pipe(\n  debounceTime(350),distinctUntilChanged(),\n  switchMap(t => of(['Cartão', 'Conta corrente', 'Crédito pessoal'].filter(x=>x.toLowerCase().includes(t.toLowerCase()))).pipe(delay(220)))\n ).subscribe(r=>{this.resultados=r;this.status=r.length?'Resultados atualizados':'Nada encontrado';}); }\n buscar(t:string){this.entrada.next(t)}\n ngOnDestroy(){this.sub.unsubscribe()}\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Explique a simulação de busca.","Peça debouncing e cancelamento de consultas.","Explore loading e erros."],"questions":["Por que switchMap e não mergeMap?","Como evitar memory leak?","Qual o comportamento em falha de rede?"],"observations":["Operadores corretos e limpeza","Tratamento de corrida, loading e erro"]},{"id":"forms","name":"Formulário bancário","tag":"Forms","level":"Pleno","time":25,"goal":"Validar inputs críticos com foco em UX e segurança.","task":"Adicione validações cruzadas, mensagens acessíveis e impedimento de duplo envio.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\nimport { ReactiveFormsModule, FormBuilder, Validators } from '@angular/forms';\n\n@Component({ selector:'app-root', standalone:true, imports:[ReactiveFormsModule],\n template:`<main style=\"font-family:system-ui;max-width:550px;padding:28px;margin:auto\">\n <h1>Transferência de saldo</h1>\n <form [formGroup]=\"form\" (ngSubmit)=\"enviar()\">\n <p><label>Conta destino <input formControlName=\"destino\"></label></p>\n <p><label>Valor (R$) <input type=\"number\" formControlName=\"valor\"></label></p>\n <p><button type=\"submit\">Transferir</button></p>\n </form>\n <p>{{mensagem}}</p>\n </main>`})\nexport class AppComponent {\n private fb = new FormBuilder();\n form = this.fb.group({ destino: ['', Validators.required], valor: [0, [Validators.required,Validators.min(0.01)]] });\n mensagem = '';\n enviar() { this.mensagem = this.form.valid ? 'Validação básica passou' : 'Confira os campos'; }\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Comece pela regra de negócio.","Peça validação cruzada e feedback.","Pergunte sobre idempotência na API."],"questions":["Validar no front-end é suficiente?","Como evitar submissão duplicada?","Como mostrar erros para leitores de tela?"],"observations":["Validadores e estados de formulário","Acessibilidade e prevenção de duplicidade"]},{"id":"performance","name":"50 mil registros","tag":"Performance","level":"Sênior","time":35,"goal":"Avaliar renderização de grandes listas.","task":"Transforme o protótipo em uma lista virtualizada, mantendo pesquisa responsiva.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal, computed, ChangeDetectionStrategy } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n\ninterface Pedido {id:number;cliente:string;valor:number}\n@Component({selector:'app-root',standalone:true, changeDetection:ChangeDetectionStrategy.OnPush,\n template:`<main style=\"font-family:system-ui;padding:24px\"><h1>50 mil pedidos</h1>\n <input aria-label=\"Pesquisar\" (input)=\"busca.set($any($event.target).value)\" placeholder=\"Pesquisar...\" />\n <p>{{filtrados().length}} pedidos encontrados</p>\n <section style=\"height:330px;overflow:auto;border:1px solid #ccd\">\n @for (p of visiveis();track p.id){<div style=\"padding:8px;border-bottom:1px solid #ddd\">{{p.id}} - {{p.cliente}} - R$ {{p.valor}}</div>}\n </section></main>`})\nexport class AppComponent {\n readonly pedidos=signal<Pedido[]>(Array.from({length:50000},(_,i)=>({id:i+1,cliente:`Cliente ${i+1}`,valor:100+i})));\n readonly busca=signal('');\n readonly filtrados=computed(()=>this.pedidos().filter(p=>p.cliente.toLowerCase().includes(this.busca().toLowerCase())));\n readonly visiveis=computed(()=>this.filtrados().slice(0,80)); // TODO: tornar o scroll virtual e preservar fluidez\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Peça diagnóstico do gargalo.","Implemente uma otimização mensurável.","Exija explicação de trade-offs."],"questions":["Por que track por ID?","Quando usar virtual scroll?","Como provar que melhorou?"],"observations":["Performance medida, não presumida","OnPush, janela visível e cancelamento"]},{"id":"live","name":"Dashboard de eventos","tag":"Arquitetura","level":"Sênior","time":35,"goal":"Modelar eventos em tempo real sem perder histórico.","task":"Separe estado atual de histórico, trate reconexões e eventos fora de ordem.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n\ntype Evento = {id:number;status:'ON'|'OFF';timestamp:number};\n@Component({selector:'app-root',standalone:true,\n template:`<main style=\"padding:28px;font-family:system-ui\"><h1>Monitor de serviços</h1>\n <button (click)=\"gerar()\">Simular evento</button>\n <p>Máquina 1: <strong>{{atual()}}</strong></p>\n <ul>@for (e of historico();track e.timestamp){<li>{{e.status}} às {{e.timestamp}}</li>}</ul>\n </main>`})\nexport class AppComponent {\n readonly historico=signal<Evento[]>([]);\n readonly atual=signal<'ON'|'OFF'>('OFF');\n gerar(){const novo:Evento={id:1,status:this.atual()==='ON'?'OFF':'ON',timestamp:Date.now()};\n  this.atual.set(novo.status);this.historico.update(h=>[...h,novo]);}\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Modele eventos e estado.","Evolua para múltiplas máquinas.","Questione perda de conexão."],"questions":["Como tratar out-of-order?","Que dados você persistiria?","RxJS, Signals ou NgRx: por quê?"],"observations":["Separação de responsabilidades","Reconexão, idempotência e testes"]},{"id":"access","name":"Componente acessível","tag":"UI","level":"Pleno","time":20,"goal":"Avaliar qualidade da interação e acessibilidade.","task":"Adicione suporte consistente a teclado, roving tabindex e ARIA.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n@Component({selector:'app-root',standalone:true,\n template:`<main style=\"padding:25px;font-family:system-ui\"><h1>Seletor de investimentos</h1>\n <p>Implemente navegação por teclado, foco visível e estados ARIA apropriados.</p>\n <div role=\"listbox\" aria-label=\"Tipo de investimento\">\n @for (x of opcoes;track x){<button type=\"button\" (click)=\"selecionado.set(x)\"\n [attr.aria-selected]=\"selecionado()===x\" style=\"margin:5px;padding:12px\">{{x}}</button>}\n </div><p>Selecionado: {{selecionado()}}</p></main>`})\nexport class AppComponent {opcoes=['Tesouro','CDB','Fundo'];selecionado=signal('Tesouro')}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Peça demonstração sem mouse.","Explore foco e semântica.","Solicite um teste de acessibilidade."],"questions":["Quando usar button ou listbox?","Como seria o fluxo com leitor de tela?","Qual a diferença entre selected e focused?"],"observations":["HTML semântico e navegação","Estados ARIA coerentes"]},{"id":"design","name":"Arquitetura de uma squad","tag":"System Design","level":"Tech Lead","time":35,"goal":"Desenhar frontend sustentável para múltiplas squads.","task":"No whiteboard, desenhe módulos, design system, estado, auth, observabilidade e deploy.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal, computed, ChangeDetectionStrategy } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n\ninterface Solicitacao { id: number; cliente: string; status: 'pendente' | 'aprovada' | 'rejeitada'; valor: number }\n\n@Component({\n selector: 'app-root', standalone: true,\n changeDetection: ChangeDetectionStrategy.OnPush,\n template: `<main style=\"font-family:system-ui;padding:28px;max-width:780px;margin:auto\">\n <h1>Solicitações de crédito</h1>\n <p>Implemente uma busca por cliente e um filtro de status que funcionem juntos.</p>\n <input aria-label=\"Buscar cliente\" placeholder=\"Buscar cliente\" (input)=\"busca.set($any($event.target).value)\" />\n <select aria-label=\"Filtrar status\" (change)=\"status.set($any($event.target).value)\">\n <option value=\"todos\">Todos</option><option value=\"pendente\">Pendente</option><option value=\"aprovada\">Aprovada</option><option value=\"rejeitada\">Rejeitada</option>\n </select>\n <p>{{ resultados().length }} resultado(s)</p>\n @for (item of resultados(); track item.id) {\n <article style=\"padding:12px;border:1px solid #ccd;margin:8px 0;border-radius:8px\">\n <strong>{{item.cliente}}</strong> · {{item.status}} · R$ {{item.valor}}\n </article>\n } @empty { <p>Nenhum resultado.</p> }\n </main>`\n})\nexport class AppComponent {\n readonly itens = signal<Solicitacao[]>([\n  {id:1,cliente:'Ana Lima',status:'pendente',valor:1200},\n  {id:2,cliente:'Bruno Dias',status:'aprovada',valor:3400},\n  {id:3,cliente:'Clara Souza',status:'rejeitada',valor:900}\n ]);\n readonly busca = signal('');\n readonly status = signal('todos');\n readonly resultados = computed(() => this.itens()); // TODO: aplique os dois filtros sem mutar a origem\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Deixe o candidato mapear fronteiras.","Introduza 3 squads e releases independentes.","Peça trade-offs e plano de evolução."],"questions":["Como evitar dependências entre squads?","Quando microfrontends fazem sentido?","Como medir qualidade e entrega?"],"observations":["Trade-offs e fronteiras claras","Governança sem burocracia"]},{"id":"liquidity","name":"Gestão de liquidez","tag":"Finanças","level":"Tech Lead","time":40,"goal":"Desenhar uma interface robusta de posições e liquidez.","task":"Projete no whiteboard uma tela com consulta de posições, atualização em tempo real, auditoria e autorização.","starter":"import '@angular/compiler';\nimport 'zone.js';\nimport { Component, signal } from '@angular/core';\nimport { bootstrapApplication } from '@angular/platform-browser';\n\ntype Evento = {id:number;status:'ON'|'OFF';timestamp:number};\n@Component({selector:'app-root',standalone:true,\n template:`<main style=\"padding:28px;font-family:system-ui\"><h1>Monitor de serviços</h1>\n <button (click)=\"gerar()\">Simular evento</button>\n <p>Máquina 1: <strong>{{atual()}}</strong></p>\n <ul>@for (e of historico();track e.timestamp){<li>{{e.status}} às {{e.timestamp}}</li>}</ul>\n </main>`})\nexport class AppComponent {\n readonly historico=signal<Evento[]>([]);\n readonly atual=signal<'ON'|'OFF'>('OFF');\n gerar(){const novo:Evento={id:1,status:this.atual()==='ON'?'OFF':'ON',timestamp:Date.now()};\n  this.atual.set(novo.status);this.historico.update(h=>[...h,novo]);}\n}\nbootstrapApplication(AppComponent).catch(console.error);\n","steps":["Peça fluxo ponta a ponta.","Introduza dados atrasados e divergentes.","Explore segurança e observabilidade."],"questions":["Como distinguir dado stale?","Como separar BFF e API de domínio?","Como testar com dependências instáveis?"],"observations":["Domínio e resiliência","Auditoria, segurança e experiência do usuário"]}];</script>
<script>'use strict';
// BraArena Simple v2. Dados no navegador; Angular compilado via StackBlitz quando online.
const KEY='braarena-simple-v2'; const DB_VERSION=1; const SCHEMA=2;
const weights=[['Angular e arquitetura',30],['Raciocínio e solução',25],['Qualidade e testes',20],['Comunicação',15],['Autonomia e liderança',10]];
let db=null, memoryOnly=false, app={schema:SCHEMA,sessions:[],activeId:null},repoInfo={baseHead:null,baseState:null,repoId:null},localHead=null,saveTimer=null,dirty=false,lastSave=0;
let tab='code',vm=null,vmSession=null,vmLoading=false,vmPoll=null,sdkPromise=null,boardTool='pen',boardColor='#3158d6',boardSize=3,boardDraft=null,boardCanvas=null,boardCtx=null,boardContainer=null,boardFull=false,conflictSession=null;
const $=(sel,root=document)=>root.querySelector(sel);const $$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
const clone=v=>JSON.parse(JSON.stringify(v)); const validId=v=>typeof v==='string'&&/^[a-zA-Z0-9_-]{3,100}$/.test(v); const iso=()=>new Date().toISOString();
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fmt=d=>{try{return new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});}catch{return '-'}};
function toast(msg,bad=false){let el=$('#toastRoot');el.innerHTML=`<div class="toast" style="background:${bad?'#763344':'#14351e'}">${esc(msg)}</div>`;clearTimeout(toast.tm);toast.tm=setTimeout(()=>{el.innerHTML='';},4400)}
function status(txt,bad=false){$('#storageStatus').innerHTML=`<span class="dot" style="background:${bad?'#ffaca4':'#80e7a7'}"></span>${esc(txt)}`}
function createDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(KEY,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;for(const s of ['work','commits','snapshots','handles'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbRead(store,key){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbAll(store){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function dbWrite(store,key,val){return new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function dbBatch(writes){return new Promise((resolve,reject)=>{const stores=[...new Set(writes.map(x=>x[0]))];const t=db.transaction(stores,'readwrite');for(const [store,key,value]of writes)t.objectStore(store).put(value,key);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function init(){try{db=await createDb();const a=await dbRead('work','current');if(a?.schema===SCHEMA)app=a;repoInfo=await dbRead('work','repoInfo')||repoInfo;localHead=await dbRead('work','localHead')||null;status('Salvo no navegador');}catch(e){memoryOnly=true;status('Armazenamento indisponível',true);toast('O navegador bloqueou o IndexedDB. Exporte JSON regularmente.',true)}render()}
function current(){return app.sessions.find(x=>x.id===app.activeId)||null}
function ch(id){return CATALOG.find(x=>x.id===id)||CATALOG[0]}
function scheduleSave(){dirty=true;status(memoryOnly?'Sem persistência local':'Salvando...');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,350)}
async function saveNow(){clearTimeout(saveTimer);if(memoryOnly)return;try{await dbWrite('work','current',app);dirty=false;lastSave=Date.now();status('Salvo no navegador')}catch(e){status('Falha ao salvar',true);toast('Não foi possível salvar. Faça backup em JSON.',true)}}
function setField(name,value){const s=current();if(!s)return;s[name]=value;if(name==='code'&&s.files)s.files['main.ts']=value;s.updatedAt=iso();scheduleSave()}
function emptyHtml(){return `<div class="intro"><div class="tag blue">ENTREVISTAS ANGULAR</div><h1>Comece a entrevista em segundos.</h1><p>Um desafio prático, um quadro branco e uma avaliação guiada. Tudo no mesmo lugar.</p>${formHtml()}<div class="session-pills">${app.sessions.slice().reverse().slice(0,9).map(s=>`<button class="session-pill" data-open="${esc(s.id)}"><strong>${esc(s.candidate)}</strong> <span class="muted">${esc(ch(s.challengeId).name)}</span></button>`).join('')}</div><p class="footer-note">Os dados ficam neste navegador. Para compartilhar ou transportar suas entrevistas, use Dados e versões → Exportar backup.</p></div>`}
function formHtml(){return `<form class="card newform" id="newForm"><h2 style="font-size:17px">Nova entrevista</h2><div class="formgrid"><div><label for="candidateInput">Nome do candidato</label><input required maxlength="120" class="field" id="candidateInput" placeholder="Ex.: Maria Silva"></div><div><label for="interviewerInput">Entrevistador</label><input class="field" id="interviewerInput" maxlength="120" placeholder="Seu nome (opcional)"></div><div><label for="roleInput">Perfil avaliado</label><select id="roleInput"><option>Desenvolvedor Angular Pleno</option><option>Desenvolvedor Angular Sênior</option><option>Tech Lead Angular</option></select></div><div><label for="challengeInput">Desafio</label><select id="challengeInput">${CATALOG.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.time} min</option>`).join('')}</select></div></div><div class="subrow"><button class="btn primary" type="submit">Iniciar entrevista →</button><small>Você pode trocar o desafio depois.</small></div></form>`}
function render(){const s=current();if(!s){$('#app').innerHTML=emptyHtml();return}const c=ch(s.challengeId);$('#app').innerHTML=`<div class="dashboard-title"><div><small>BraArena / Sessão de entrevista</small><h1>${esc(s.candidate)} <span class="tag blue">${esc(s.role)}</span></h1><p>${esc(s.interviewer||'Entrevistador não informado')} · iniciada em ${fmt(s.startedAt)} · ${s.status==='finalizada'?'Finalizada':'Em andamento'}</p></div><div class="right-actions"><button class="btn small" id="chooseSession">Trocar entrevista</button><button class="btn primary small" id="saveVersionBtn">Salvar versão</button></div></div><div class="workspace"><aside class="card side"><h2>01 · Desafio</h2><label for="challengeActive">Exercício selecionado</label><select id="challengeActive" class="challSelect">${CATALOG.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="challenge-hero"><h3>${esc(c.name)}</h3><p>${esc(c.goal)}</p><span class="tag blue">${esc(c.tag)}</span><span class="tag">${esc(c.level)}</span><span class="tag">${c.time} min</span></div><h2 style="margin-top:20px">O que pedir</h2><p style="font-size:12px">${esc(c.task)}</p><h2 style="margin-top:20px">Condução sugerida</h2><ol>${c.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></aside><section class="card center"><div class="tabline"><nav class="tabs" aria-label="Área de trabalho"><button class="tab ${tab==='code'?'active':''}" data-tab="code">⌘ Código Angular</button><button class="tab ${tab==='board'?'active':''}" data-tab="board">✎ Whiteboard</button><button class="tab ${tab==='score'?'active':''}" data-tab="score">✓ Avaliação</button></nav><span class="savehint" id="workHint">Autosave ativo</span></div><div id="tabpanel" class="tab-main"></div></section><aside class="card guide"><h2>02 · Playbook do entrevistador</h2><p style="font-size:12px">Guia de apoio. Observe como a pessoa pensa, não só se terminou.</p><h3>Perguntas de aprofundamento</h3><ul>${c.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><h3>Critérios de observação</h3><ul>${c.observations.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><div class="hint"><strong>Ritmo sugerido</strong><br>5 min: contextualizar · ${Math.max(10,c.time-10)} min: prática · 5 min: discussão. Evite conduzir a solução.</div><h3>Anotações rápidas</h3><textarea id="notes" rows="7" placeholder="Evidências concretas, decisões, dificuldades e trade-offs...">${esc(s.notes||'')}</textarea><small>Notas salvas automaticamente no navegador.</small></aside></div>`;renderTab()}
function renderTab(){const s=current();if(!s)return;$$('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));const panel=$('#tabpanel');if(tab==='code'){panel.innerHTML=`<div class="section-top"><div><h2>Código Angular</h2><p>Rascunhe offline ou abra o compilador Angular com preview.</p></div><div class="toolrow"><button class="btn small ${vm&&vmSession===s.id?'':'primary'}" id="runCompiler">▶ ${vm&&vmSession===s.id?'Reabrir compilador':'Compilar Angular'}</button><button class="btn small ${vm?'':'hidden'}" id="captureCode">↓ Capturar código</button><button class="btn small ${vm?'':'hidden'}" id="returnCode">Editor local</button><button class="btn small" id="openCompilerTab">↗ Nova aba</button></div></div><div class="banner" id="compilerNote">O editor local e o whiteboard funcionam offline. A compilação Angular usa StackBlitz e requer internet; ela não é simulada pela BraArena.</div><div id="localEditorWrap"><textarea id="codeEditor" class="editor" aria-label="Código Angular">${esc(s.code||'')}</textarea><div class="footer-note">O conteúdo deste editor é salvo em IndexedDB. Ao utilizar o compilador, clique em “Capturar código” antes de fechar a sessão.</div></div><div id="ideWrap" class="hidden"><div class="compiler-host"><div id="angularHost" style="height:100%"></div></div><p class="footer-note">A BraArena lê os arquivos do editor integrado periodicamente e ao clicar em Capturar código. Projetos novos do StackBlitz não são persistidos lá automaticamente.</p></div>`;if(vm&&vmSession===s.id){ // a recriação do DOM encerra o iframe; reabrir exige nova integração
vm=null;vmSession=null;stopVmPoll();}
}else if(tab==='board'){panel.innerHTML=`<div id="boardWorkspace"><div class="section-top"><div><h2>Whiteboard</h2><p>Desenhe arquitetura, fluxos, componentes e integrações.</p></div><div class="toolrow"><button class="btn small" id="boardExpand">⛶ Expandir</button></div></div><div class="toolrow" style="margin-bottom:11px"><button class="btn small tool ${boardTool==='pen'?'active':''}" data-tool="pen" title="Caneta">✎ Caneta</button><button class="btn small tool ${boardTool==='line'?'active':''}" data-tool="line" title="Linha">／ Linha</button><button class="btn small tool ${boardTool==='rect'?'active':''}" data-tool="rect" title="Retângulo">▢ Caixa</button><button class="btn small tool ${boardTool==='text'?'active':''}" data-tool="text">T Texto</button><button class="btn small tool ${boardTool==='erase'?'active':''}" data-tool="erase">⌫ Borracha</button><input id="boardColor" class="colorinput" type="color" aria-label="Cor do traço" value="${boardColor}"><button class="btn small" id="boardUndo">↶ Desfazer</button><button class="btn small" id="boardClear">Limpar</button><button class="btn small" id="boardPng">↓ PNG</button></div><div class="whiteboard-wrap"><canvas class="whiteboard-canvas" id="whiteboard" tabindex="0" aria-label="Quadro branco para desenhar" role="img"></canvas></div><p class="footer-note">O desenho é salvo como elementos editáveis no navegador e no backup JSON, sem depender de imagens remotas.</p></div>`;initCanvas()}
else{const rated=weights.filter(([n])=>s.scores[n]!=null).length;const total=Math.round(weights.reduce((sum,[n,w])=>sum+(Number(s.scores[n]??0)*w/4),0));panel.innerHTML=`<div class="section-top"><div><h2>Avaliação estruturada</h2><p>Atribua uma nota de 0 a 4 com base em evidências, não em impressão geral.</p></div><button class="btn small" id="printReport">Imprimir / PDF</button></div><div class="score-grid">${weights.map(([name,w])=>`<div class="score-item"><div class="score-label"><strong>${esc(name)}</strong><small>Peso ${w}%</small></div><div class="score-values">${[0,1,2,3,4].map(n=>`<button class="score-btn ${s.scores[name]===n?'on':''}" data-score="${esc(name)}" data-value="${n}" title="Nota ${n}">${n}</button>`).join('')}</div></div>`).join('')}</div><div class="scoreline"><div class="result-box"><div class="score-total">${rated?total+' / 100':'Sem nota'}</div><p>${rated} de 5 dimensões avaliadas${rated<5?' · avaliação parcial':''}</p></div><div><label for="decision">Conclusão humana</label><select id="decision"><option ${s.decision==='Em análise'?'selected':''}>Em análise</option><option ${s.decision==='Avançar'?'selected':''}>Avançar</option><option ${s.decision==='Revisar'?'selected':''}>Revisar</option><option ${s.decision==='Não avançar'?'selected':''}>Não avançar</option></select></div></div><label for="followup">Síntese e próximos passos</label><textarea id="followup" rows="5" placeholder="O que sustentou sua avaliação? Onde há incerteza?">${esc(s.followup||'')}</textarea><div class="subrow" style="margin-top:12px"><button class="btn primary" id="finishSession">${s.status==='finalizada'?'Reabrir entrevista':'Concluir entrevista'}</button><button class="btn" id="exportReport">Exportar relatório HTML</button></div><p class="footer-note">Notas são apoio à entrevista, não uma decisão automática de contratação. Reavalie vieses e evidências.</p>`}}
function createSession(data){stopVmPoll();vm=null;vmSession=null;const c=ch(data.challengeId);const s={id:uid(),candidate:data.candidate.trim(),interviewer:data.interviewer.trim(),role:data.role,challengeId:c.id,startedAt:iso(),updatedAt:iso(),status:'andamento',code:c.starter,board:[],notes:'',scores:{},decision:'Em análise',followup:''};app.sessions.push(s);app.activeId=s.id;tab='code';scheduleSave();render();toast('Entrevista criada. Boa conversa!')}
function showNew(){openModal('Nova entrevista',formHtml().replace('<form class="card newform"','<form class="newform"'));}
function openModal(title,body){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn small" id="closeModal">Fechar ✕</button></div><div class="modal-body">${body}</div></section></div>`}
function closeModal(){if(conflictSession)return;$('#modalRoot').innerHTML=''}
function showList(){const rows=app.sessions.slice().reverse().map(s=>`<div class="history-row"><div><strong>${esc(s.candidate)}</strong><small>${esc(ch(s.challengeId).name)} · ${fmt(s.startedAt)} · ${s.status==='finalizada'?'Finalizada':'Em andamento'}</small></div><button class="btn small" data-open="${esc(s.id)}">Abrir</button></div>`).join('');openModal('Suas entrevistas',`<div class="subrow"><button class="btn primary" id="newFromList">+ Nova entrevista</button><small>As entrevistas são privadas deste navegador até a exportação ou sincronização com pasta.</small></div><hr class="separator">${rows||'<p>Nenhuma entrevista criada ainda.</p>'}`)}
function reportHtml(s){const rated=weights.filter(([n])=>s.scores[n]!==undefined).length;const total=Math.round(weights.reduce((a,[n,w])=>a+(Number(s.scores[n]??0)*w/4),0));const lis=weights.map(([n,w])=>`<tr><td>${esc(n)}</td><td>${w}%</td><td>${s.scores[n]??'Não avaliada'}</td></tr>`).join('');return `<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Relatório BraArena</title><style>body{font:15px/1.55 Arial,sans-serif;max-width:820px;margin:30px auto;padding:20px;color:#182641}h1{border-bottom:3px solid #345adf}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}pre{white-space:pre-wrap;background:#eef1f6;padding:15px}small{color:#667}section{margin:24px 0}</style><h1>BraArena · Avaliação técnica</h1><p><b>Candidato:</b> ${esc(s.candidate)}<br><b>Entrevistador:</b> ${esc(s.interviewer||'Não informado')}<br><b>Vaga:</b> ${esc(s.role)}<br><b>Desafio:</b> ${esc(ch(s.challengeId).name)}<br><b>Data:</b> ${fmt(s.startedAt)}</p><section><h2>Critérios</h2><table><tr><th>Dimensão</th><th>Peso</th><th>Nota (0 a 4)</th></tr>${lis}</table><p><b>Pontuação ponderada:</b> ${total}/100 (${rated}/5 critérios respondidos)</p><p><b>Conclusão registrada:</b> ${esc(s.decision)}</p></section><section><h2>Evidências</h2><pre>${esc(s.notes||'Não registradas')}</pre></section><section><h2>Próximos passos</h2><pre>${esc(s.followup||'Não registrados')}</pre></section><small>Relatório produzido localmente. A nota não substitui a decisão humana.</small></html>`}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function initCanvas(){const canvas=$('#whiteboard');if(!canvas)return;boardCanvas=canvas;boardCtx=canvas.getContext('2d');boardContainer=$('#boardWorkspace');resizeCanvas();canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);window.addEventListener('resize',resizeCanvas,{passive:true})}

function coords(ev){const r=boardCanvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))}}

function pointerMove(ev){if(!boardDraft||!boardCanvas?.hasPointerCapture(ev.pointerId))return;const pt=coords(ev);if(boardDraft.tool==='pen')boardDraft.points.push(pt);else boardDraft.points[1]=pt;redraw()}
function pointerUp(ev){if(!boardDraft)return;const pt=coords(ev);if(boardDraft.tool!=='pen')boardDraft.points[1]=pt;current().board.push(boardDraft);boardDraft=null;scheduleSave();redraw()}

function stableHash(json){let h=2166136261;for(let i=0;i<json.length;i++){h^=json.charCodeAt(i);h=Math.imul(h,16777619)}return ('00000000'+(h>>>0).toString(16)).slice(-8)}

function sharedState(){return {schema:SCHEMA,sessions:clone(app.sessions)}}
async function getFolder(){if(!db)return null;return await dbRead('handles','folder')||null}

const isObject=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function merge3(base,local,remote,path='',conflicts=[]){if(eq(local,remote))return cloneVal(local);if(eq(base,local))return cloneVal(remote);if(eq(base,remote))return cloneVal(local);if(Array.isArray(local)&&Array.isArray(remote)&&(!base||Array.isArray(base))&&[...local,...remote,...(base||[])].every(x=>isObject(x)&&typeof x.id==='string')){let ids=[...new Set([...(base||[]),...local,...remote].map(x=>x.id))];let res=[];for(let id of ids){const b=(base||[]).find(x=>x.id===id),l=local.find(x=>x.id===id),r=remote.find(x=>x.id===id);const value=merge3(b,l,r,`${path}/id:${id}`,conflicts);if(value!==undefined)res.push(value)}return res}if(isObject(local)&&isObject(remote)&&(base==null||isObject(base))){const out={};let keys=[...new Set([...Object.keys(base||{}),...Object.keys(local),...Object.keys(remote)])];for(const k of keys){if(['__proto__','constructor','prototype'].includes(k))continue;const x=merge3(base?.[k],local[k],remote[k],path+'/'+k,conflicts);if(x!==undefined)out[k]=x}return out}if(local===undefined||remote===undefined||!eq(local,remote)){conflicts.push({path,base,local,remote});return cloneVal(local)}return cloneVal(local)}
function cloneVal(x){return x===undefined?undefined:clone(x)}
function setAtPath(obj,path,value){const parts=path.split('/').filter(Boolean);let root=obj;for(let i=0;i<parts.length;i++){let p=parts[i],last=i===parts.length-1;if(['__proto__','constructor','prototype'].includes(p))return;if(p.startsWith('id:')){const id=p.slice(3);if(!Array.isArray(root))return;let index=root.findIndex(x=>x.id===id);if(last){if(value===undefined){if(index>=0)root.splice(index,1)}else if(index>=0)root[index]=clone(value);else root.push(clone(value));return}if(index<0){root.push({id});index=root.length-1}root=root[index]}else{if(last){if(value===undefined)delete root[p];else root[p]=clone(value);return}if(root[p]==null)root[p]=parts[i+1]?.startsWith('id:')?[]:{};root=root[p]}}}
async function readRepo(folder){const manifest=await readJSON(folder,'manifest.json');const refs=await folder.getDirectoryHandle('refs',{create:true});const snapshots=await folder.getDirectoryHandle('snapshots',{create:true});const commits=await folder.getDirectoryHandle('commits',{create:true});const head=await readJSON(refs,'main.json');return{manifest,refs,snapshots,commits,head}}

async function syncFolder(){if(memoryOnly)return toast('Ative o armazenamento do navegador para sincronizar.',true);if(vm&&!await captureVm(false))return;await saveNow();let folder=await authorizedFolder();if(!folder){toast('Autorize uma pasta pelo botão Escolher pasta.',true);return}try{const repo=await readRepo(folder);if(repo.manifest&&repo.manifest.schema!==SCHEMA)throw Error('Repositório com outra versão de schema');if(repoInfo.repoId&&repo.manifest&&repo.manifest.repositoryId!==repoInfo.repoId)throw Error('Esta pasta pertence a outro repositório BraArena');const remote=await loadRemote(repo);const remHead=repo.head?.id||null;if(remHead&&eq(remote,sharedState())&&repoInfo.baseHead===remHead){toast('A pasta já está atualizada.');return}const base=(repoInfo.repoId===repo.manifest?.repositoryId&&repoInfo.baseState)?repoInfo.baseState:{schema:SCHEMA,sessions:[]};const local=sharedState();let conflicts=[];let merged=merge3(base,local,remote,'',conflicts);if(conflicts.length){conflictSession={folder,remoteHead:remHead,remote,merged,conflicts,repoId:repo.manifest?.repositoryId||repoInfo.repoId||uid()};showConflicts();return}await finishSync(folder,remHead,merged,repo.manifest?.repositoryId||repoInfo.repoId||uid());toast('Pasta sincronizada com sucesso');await dataDialog()}catch(e){toast('Não foi possível sincronizar: '+(e.message||e),true)}}
function showConflicts(){const x=conflictSession;openModal('Resolver alterações concorrentes',`<p class="danger-note">Há ${x.conflicts.length} conflito(s). Nenhuma alteração na pasta foi sobrescrita. Escolha qual versão usar para cada campo.</p><form id="conflictForm">${x.conflicts.map((c,i)=>`<div class="conflictrow"><h3>${esc(c.path||'Raiz')}</h3><div class="twocol"><div><label><input type="radio" name="conflict${i}" value="local" checked> Minha versão</label><pre>${esc(JSON.stringify(c.local,null,2))}</pre></div><div><label><input type="radio" name="conflict${i}" value="remote"> Da pasta</label><pre>${esc(JSON.stringify(c.remote,null,2))}</pre></div></div></div>`).join('')}<button class="btn primary" type="submit">Aplicar decisões e sincronizar</button><button class="btn" type="button" id="cancelConflicts">Cancelar</button></form>`)}
async function finishSync(folder,expectedHead,merged,repoId){const repo=await readRepo(folder);if((repo.head?.id||null)!==expectedHead)throw Error('A pasta mudou durante a resolução. Reinicie a sincronização para evitar sobrescrita.');if(repo.manifest&&repo.manifest.repositoryId!==repoId)throw Error('ID do repositório divergente');const snapId=uid(),commitId=uid(),txt=JSON.stringify(merged),digest=await hashOf(txt),snapshot={id:snapId,schema:SCHEMA,createdAt:iso(),digest,data:merged},commit={id:commitId,parent:expectedHead,snapshotId:snapId,createdAt:iso(),message:'BraArena sync',schema:SCHEMA,digest};if(!repo.manifest)await writeJSON(folder,'manifest.json',{schema:SCHEMA,repositoryId:repoId,createdAt:iso(),format:'BraArena-local-first'});await writeImmutable(repo.snapshots,snapId+'.json',snapshot);await writeImmutable(repo.commits,commitId+'.json',commit);const check=await readJSON(repo.refs,'main.json');if((check?.id||null)!==expectedHead)throw Error('Outra gravação ocorreu antes da publicação. A cópia local está íntegra.');await writeJSON(repo.refs,'main.json',{id:commitId,snapshotId:snapId,updatedAt:iso()});const verify=await readJSON(repo.refs,'main.json');if(verify?.id!==commitId)throw Error('Não foi possível confirmar a publicação. Reconciliar antes de tentar de novo.');repoInfo={repoId,baseHead:commitId,baseState:clone(merged)};app.sessions=clone(merged.sessions);if(!current())app.activeId=app.sessions[0]?.id||null;await dbBatch([['work','repoInfo',repoInfo],['work','current',app]]);dirty=false;status('Salvo e sincronizado');}
// ---------- Event handlers ----------
document.addEventListener('submit',async e=>{if(e.target?.id==='newForm'){e.preventDefault();if(!(await safeStopCompiler()))return;const f=e.target;const name=$('#candidateInput',f)?.value?.trim();if(!name)return;createSession({candidate:name,interviewer:$('#interviewerInput',f)?.value||'',role:$('#roleInput',f)?.value||'Angular',challengeId:$('#challengeInput',f)?.value});closeModal()}else if(e.target?.id==='conflictForm'){e.preventDefault();const x=conflictSession;if(!x)return;try{for(let i=0;i<x.conflicts.length;i++){const choice=$(`input[name="conflict${i}"]:checked`)?.value;if(choice==='remote')setAtPath(x.merged,x.conflicts[i].path,x.conflicts[i].remote)}await finishSync(x.folder,x.remoteHead,x.merged,x.repoId);conflictSession=null;closeModal();render();toast('Conflitos resolvidos. Pasta sincronizada.')}catch(err){toast(err.message,true)}}});
document.addEventListener('input',e=>{if(e.target?.id==='codeEditor')setField('code',e.target.value);if(e.target?.id==='notes')setField('notes',e.target.value);if(e.target?.id==='followup')setField('followup',e.target.value);if(e.target?.id==='boardColor')boardColor=e.target.value});
document.addEventListener('change',e=>{if(e.target?.id==='challengeActive')void changeChallenge(e.target.value);if(e.target?.id==='decision')setField('decision',e.target.value)});
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;if(t.id==='homeLink'){e.preventDefault();if(!(await safeStopCompiler()))return;app.activeId=null;tab='code';scheduleSave();render();return}if(t.id==='newBtn'||t.id==='newFromList'){showNew();return}if(t.id==='dataBtn'){await dataDialog();return}if(t.id==='closeModal'||t.id==='cancelConflicts'){conflictSession=null;closeModal();return}if(t.id==='newFromList')return;if(t.id==='chooseSession'){if(!(await safeStopCompiler()))return;showList();return}if(t.dataset.open){if(!(await safeStopCompiler()))return;app.activeId=t.dataset.open;tab='code';scheduleSave();closeModal();render();return}if(t.dataset.tab){if(t.dataset.tab!==tab){if(!(await safeStopCompiler()))return;if(boardFull)boardFull=false;tab=t.dataset.tab;renderTab()}return}if(t.id==='runCompiler'){await openCompiler();return}if(t.id==='openCompilerTab'){await openCompilerTab();return}if(t.id==='captureCode'){await captureVm();return}if(t.id==='returnCode'){await returnEditor();return}if(t.dataset.tool){boardTool=t.dataset.tool;$$('[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool===boardTool));return}if(t.id==='boardUndo'){const b=current()?.board;if(b?.length){b.pop();scheduleSave();redraw()}return}if(t.id==='boardClear'){if(confirm('Limpar este quadro branco? O histórico de versões pode recuperar a versão anterior.')){current().board=[];scheduleSave();redraw()}return}if(t.id==='boardPng'){exportBoard();return}if(t.id==='boardExpand'){fullBoard();return}if(t.dataset.score){current().scores[t.dataset.score]=Number(t.dataset.value);scheduleSave();renderTab();return}if(t.id==='finishSession'){setField('status',current().status==='finalizada'?'andamento':'finalizada');render();toast(current().status==='finalizada'?'Entrevista concluída':'Entrevista reaberta');return}if(t.id==='printReport'){const content=reportHtml(current());const w=window.open('','_blank');if(w){w.document.write(content);w.document.close();setTimeout(()=>w.print(),300)}else toast('Permita janelas pop-up para imprimir.',true);return}if(t.id==='exportReport'){download('BraArena-relatorio-'+current().candidate.replace(/[^a-z0-9]+/gi,'-')+'.html',reportHtml(current()),'text/html');return}if(t.id==='saveVersionBtn'||t.id==='saveCommit'){await saveVersion('Avaliação de '+(current()?.candidate||'workspace'));if(t.id==='saveCommit')await dataDialog();return}if(t.id==='exportBackup'){await exportBackup();return}if(t.id==='importBackup'){inputFile();return}if(t.id==='chooseFolder'){await chooseFolder();return}if(t.id==='replaceFolder'){if(confirm('Trocar de pasta? A cópia local será mantida e a sincronização com a pasta anterior será desvinculada.'))await chooseFolder(true);return}if(t.id==='syncFolder'){await syncFolder();return}if(t.dataset.restore){await restoreCommit(t.dataset.restore);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&boardFull){boardFull=false;$('#boardWorkspace')?.classList.remove('board-fullscreen');requestAnimationFrame(resizeCanvas)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveVersion('Versão manual')}});
window.addEventListener('beforeunload',e=>{if(dirty||vm){e.preventDefault();e.returnValue='';}});
init();
</script>
