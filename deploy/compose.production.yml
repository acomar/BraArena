name: braarena
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 180m
    environment:
      POSTGRES_USER: interview
      POSTGRES_DB: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [braarena_pgdata:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U interview -d interview"]
      interval: 10s
      timeout: 4s
      retries: 8
  api:
    image: ghcr.io/acomar/braarena-poc-api:${RELEASE_SHA:?}
    restart: unless-stopped
    mem_limit: 320m
    environment:
      DATABASE_URL: postgresql://interview:${POSTGRES_PASSWORD}@db/interview
      BRAARENA_RELEASE: ${RELEASE_SHA:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USD_BRL: ${USD_BRL:-}
      USD_BRL_DATE: ${USD_BRL_DATE:-}
      BRAARENA_RATES: ${BRAARENA_RATES:-}
      RECORDING_DAYS: ${RECORDING_DAYS:-30}
    depends_on:
      db: {condition: service_healthy}
    networks: [database,frontend]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:3000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
  web:
    image: ghcr.io/acomar/braarena-poc-web:${RELEASE_SHA:?}
    restart: unless-stopped
    mem_limit: 96m
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    depends_on:
      api: {condition: service_healthy}
    ports: ["${BRAARENA_IP:?}:${BRAARENA_PORT:-8443}:8443"]
    volumes:
      - ./listen-tls.conf:/etc/nginx/braarena-listeners/tls.conf:ro
      - ${TLS_CERT:?}:/run/braarena/fullchain.pem:ro
      - ${TLS_KEY:?}:/run/braarena/privkey.pem:ro
    networks: [frontend]
    healthcheck:
      test: ["CMD","wget","-qO","/dev/null","http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 8
volumes: {braarena_pgdata: {}}
networks:
  database: {internal: true}
  frontend: {}
