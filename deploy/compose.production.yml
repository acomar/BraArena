services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - braarena_pgdata:/var/lib/postgresql/data
    networks: [braarena_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      retries: 12
  api:
    image: ghcr.io/acomar/braarena-api:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://interview:${POSTGRES_PASSWORD}@db:5432/interview
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks: [braarena_internal]
  web:
    image: ghcr.io/acomar/braarena-web:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8081:80"
    networks: [braarena_internal]
volumes:
  braarena_pgdata:
networks:
  braarena_internal:
